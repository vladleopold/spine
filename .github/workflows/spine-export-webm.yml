name: Spine Export WebM

on:
  repository_dispatch:
    types: [spine-export-webm]

jobs:
  export:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Install Playwright with Chromium
        run: |
          echo "=== INSTALLING PLAYWRIGHT ==="
          npm init -y
          npm install playwright@1.59.1
          npx playwright install chromium
          echo "=== PLAYWRIGHT INSTALLED ==="

      - name: Install system dependencies
        run: |
          echo "=== INSTALLING SYSTEM DEPS ==="
          sudo apt-get update
          sudo apt-get install -y \
            libnss3 libnspr4 libatk1.0-0 libatk-bridge2.0-0 \
            libcups2 libdrm2 libdbus-1-3 libxkbcommon0 \
            libxcomposite1 libxdamage1 libxfixes3 libxrandr2 \
            libgbm1 libpango-1.0-0 libcairo2 libasound2t64 \
            libatspi2.0-0 libwayland-client0 libwayland-cursor0 \
            libwayland-egl1
          echo "=== SYSTEM DEPS INSTALLED ==="

      - name: Debug - Check files exist
        run: |
          echo "=== CHECKING FILES ==="
          uploadId="${{ github.event.client_payload.uploadId }}"
          animation="${{ github.event.client_payload.animation }}"
          uploadPath="library/${uploadId}"
          setName=$(find "${uploadPath}" -mindepth 1 -maxdepth 1 -type d -exec basename {} \; | head -1)
          echo "Upload ID: $uploadId"
          echo "Animation: $animation"
          echo "Upload Path: $uploadPath"
          echo "Set Name: $setName"
          if [ -d "${uploadPath}/${setName}" ]; then
            echo "Set directory exists"
            ls -la "${uploadPath}/${setName}/"
          else
            echo "ERROR: Set directory not found"
          fi
          echo "=== INDEX.JSON ==="
          if [ -f "library/index.json" ]; then
            echo "index.json exists"
            head -c 500 library/index.json
          else
            echo "ERROR: index.json not found"
          fi

      - name: Install ffmpeg
        run: sudo apt-get install -y ffmpeg

      - name: Compute animation duration from skeleton JSON
        id: duration
        run: |
          echo "=== COMPUTING ANIMATION DURATION ==="
          uploadId="${{ github.event.client_payload.uploadId }}"
          animation="${{ github.event.client_payload.animation }}"
          uploadPath="library/${uploadId}"
          # Find the first directory inside uploadPath
          setName=$(find "$uploadPath" -mindepth 1 -maxdepth 1 -type d -exec basename {} \; | head -1)
          skeletonPath=""
          if [ -n "$setName" ]; then
            for f in "${uploadPath}/${setName}"/*.json; do
              if [ -f "$f" ]; then
                skeletonPath="$f"
                break
              fi
            done
          fi
          echo "Skeleton path: $skeletonPath"
          echo "Animation: $animation"

          if [ -z "$skeletonPath" ] || [ ! -f "$skeletonPath" ]; then
            echo "Skeleton JSON not found, using fallback duration 0 to let browser calculate"
            echo "anim_duration=0" >> $GITHUB_OUTPUT
          else
            duration=$(node -e "
              const fs = require('fs');
              const animName = '$animation';
              const data = JSON.parse(fs.readFileSync('$skeletonPath', 'utf8'));
              const anim = data.animations && data.animations[animName];
              if (!anim) { console.log(0); process.exit(0); }
              let max = 0;
              const traverse = (obj) => {
                if (Array.isArray(obj)) {
                  obj.forEach(item => { if (item && typeof item.time === 'number' && item.time > max) max = item.time; });
                } else if (obj && typeof obj === 'object') {
                  Object.values(obj).forEach(traverse);
                }
              };
              traverse(anim);
              console.log(max > 0 ? max.toFixed(4) : 0);
            " 2>/dev/null || echo "0")
            echo "Computed duration: ${duration}s"
            echo "anim_duration=${duration}" >> $GITHUB_OUTPUT
          fi

      - name: Export WebM preview
        id: export
        run: |
          echo "=== STARTING EXPORT ==="
          uploadId="${{ github.event.client_payload.uploadId }}"
          animation="${{ github.event.client_payload.animation }}"
          animDuration="${{ steps.duration.outputs.anim_duration }}"
          
          echo "Upload ID: $uploadId"
          echo "Animation: $animation"
          echo "Animation duration: ${animDuration}s"

          node scripts/spine-export-webm.mjs \
            --upload-id="${{ github.event.client_payload.uploadId }}" \
            --animation="${{ github.event.client_payload.animation }}" \
            --origin="${{ github.event.client_payload.origin }}" \
            --owner="${{ github.event.client_payload.owner }}" \
            --repo="${{ github.event.client_payload.repo }}" \
            --branch="${{ github.event.client_payload.branch }}" \
            --repo-path="${{ github.workspace }}" \
            --anim-duration="${animDuration}" \
            --output="${{ github.workspace }}/${{ github.event.client_payload.uploadId }}-preview.webm"
          echo "=== EXPORT COMPLETED ==="
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Upload media to GitHub
        id: upload
        uses: actions/github-script@v7
        with:
          script: |
            const fs = require('fs');
            const uploadId = '${{ github.event.client_payload.uploadId }}';
            const basePath = 'library';
            const branch = '${{ github.event.client_payload.branch }}' || 'main';
            const origin = '${{ github.event.client_payload.origin }}';
            const workspace = '${{ github.workspace }}';
            
            const filesToUpload = [
              { source: `${workspace}/${uploadId}-preview.webm`, target: `${basePath}/${uploadId}/preview.webm`, key: 'webmPreview' },
              { source: `${workspace}/${uploadId}-preview-medium.webm`, target: `${basePath}/${uploadId}/preview-medium.webm`, key: 'webmPreviewMedium' },
              { source: `${workspace}/${uploadId}-preview-low.webm`, target: `${basePath}/${uploadId}/preview-low.webm`, key: 'webmPreviewLow' },
              { source: `${workspace}/${uploadId}-preview.webp`, target: `${basePath}/${uploadId}/preview.webp`, key: 'webpPoster' },
              { source: `${workspace}/${uploadId}-preview-medium.webp`, target: `${basePath}/${uploadId}/preview-medium.webp`, key: 'webpPosterMedium' },
              { source: `${workspace}/${uploadId}-preview-low.webp`, target: `${basePath}/${uploadId}/preview-low.webp`, key: 'webpPosterLow' }
            ];

            async function getSha(path) {
              try {
                const { data } = await github.rest.repos.getContent({ owner: context.repo.owner, repo: context.repo.repo, path, ref: branch });
                return data.sha;
              } catch { return null; }
            }

            const uploadedUrls = {};
            for (const file of filesToUpload) {
              if (!fs.existsSync(file.source)) {
                console.log(`Skipping missing file: ${file.source}`);
                continue;
              }
              console.log(`Uploading ${file.target}...`);
              const content = fs.readFileSync(file.source, 'base64');
              const existingSha = await getSha(file.target);
              
              await github.rest.repos.createOrUpdateFileContents({
                owner: context.repo.owner,
                repo: context.repo.repo,
                path: file.target,
                message: `Add ${file.key} media for ${uploadId}`,
                content,
                branch,
                ...(existingSha ? { sha: existingSha } : {}),
              });
              uploadedUrls[file.key] = `${origin}/assets/${file.target}`;
            }
            core.setOutput('uploaded_urls', JSON.stringify(uploadedUrls));

      - name: Update index entry with Retry Logic
        uses: actions/github-script@v7
        with:
          script: |
            const uploadId = '${{ github.event.client_payload.uploadId }}';
            const uploadedUrls = JSON.parse('${{ steps.upload.outputs.uploaded_urls }}' || '{}');
            const basePath = 'library';
            const indexPath = `${basePath}/index.json`;
            const branch = '${{ github.event.client_payload.branch }}' || 'main';

            const fs = require('fs');
            const metaPath = `${{ github.workspace }}/${uploadId}-preview.webm.json`;
            let videoMeta = {};
            if (fs.existsSync(metaPath)) {
              try { videoMeta = JSON.parse(fs.readFileSync(metaPath, 'utf8')); } catch (err) {}
            }

            // Use Git Data API (blob) to read and write index.json because it exceeds 1MB limit
            async function getBlobContent(sha) {
              const { data: blob } = await github.rest.git.getBlob({
                owner: context.repo.owner, repo: context.repo.repo, file_sha: sha,
              });
              return Buffer.from(blob.content, 'base64').toString('utf8');
            }

            // Retry logic to handle Git race conditions
            const MAX_RETRIES = 15;
            for (let i = 1; i <= MAX_RETRIES; i++) {
              try {
                const { data: tree } = await github.rest.git.getTree({
                  owner: context.repo.owner, repo: context.repo.repo, tree_sha: branch, recursive: '1',
                });
                const indexEntry = tree.tree.find(t => t.path === indexPath);
                if (!indexEntry) {
                  console.log('index.json not found in tree');
                  return;
                }

                const content = await getBlobContent(indexEntry.sha);
                const entries = JSON.parse(content);
                const entryIndex = entries.findIndex(e => e.id === uploadId);

                if (entryIndex === -1) {
                  console.log(`Entry ${uploadId} not found in index, skipping update`);
                  return;
                }

                // Clean up old chunk properties if they exist
                delete entries[entryIndex].webmChunksJson;
                delete entries[entryIndex].webmChunks;
                delete entries[entryIndex].webmChunkCount;
                delete entries[entryIndex].webmIsChunked;

                const isError = !!videoMeta.error;
                entries[entryIndex] = {
                  ...entries[entryIndex],
                  ...uploadedUrls,
                  webmPreviewPath: isError ? undefined : `${basePath}/${uploadId}/preview.webm`,
                  webmStatus: isError ? 'error' : 'ready',
                  webmError: isError ? videoMeta.error : undefined,
                  webmGeneratedAt: new Date().toISOString(),
                  ...(videoMeta.width > 0 ? { previewWidth: videoMeta.width } : {}),
                  ...(videoMeta.height > 0 ? { previewHeight: videoMeta.height } : {}),
                  ...(videoMeta.animationDuration > 0 ? { previewDuration: videoMeta.animationDuration } : {}),
                  ...(videoMeta.skeletonWidth > 0 ? { skeletonWidth: videoMeta.skeletonWidth } : {}),
                  ...(videoMeta.skeletonHeight > 0 ? { skeletonHeight: videoMeta.skeletonHeight } : {}),
                };

                const newContent = Buffer.from(JSON.stringify(entries, null, 2)).toString('base64');
                const { data: newBlob } = await github.rest.git.createBlob({
                  owner: context.repo.owner, repo: context.repo.repo, content: newContent, encoding: 'base64',
                });

                const { data: oldTree } = await github.rest.git.getTree({
                  owner: context.repo.owner, repo: context.repo.repo, tree_sha: branch, recursive: '1',
                });

                const { data: newTree } = await github.rest.git.createTree({
                  owner: context.repo.owner, repo: context.repo.repo, base_tree: oldTree.sha,
                  tree: [{ path: indexPath, mode: '100644', type: 'blob', sha: newBlob.sha }],
                });

                const { data: refData } = await github.rest.git.getRef({
                  owner: context.repo.owner, repo: context.repo.repo, ref: `heads/${branch}`,
                });

                const { data: newCommit } = await github.rest.git.createCommit({
                  owner: context.repo.owner, repo: context.repo.repo, message: `Update media preview URLs for ${uploadId}`,
                  tree: newTree.sha, parents: [refData.object.sha],
                });

                await github.rest.git.updateRef({
                  owner: context.repo.owner, repo: context.repo.repo, ref: `heads/${branch}`,
                  sha: newCommit.sha, force: true, // we use force because we are retrying on conflicts
                });
                
                console.log(`Successfully updated index for ${uploadId} on try ${i}`);
                break; // Success!
              } catch (error) {
                // If it's a conflict updating the ref
                if (error.status === 409 || error.status === 422 || error.message.includes('Update is not a fast forward')) {
                  console.log(`Conflict updating index (try ${i}/${MAX_RETRIES}). Retrying in a moment...`);
                  if (i === MAX_RETRIES) throw error;
                  const waitTime = Math.floor(Math.random() * 4000) + 2000;
                  await new Promise(resolve => setTimeout(resolve, waitTime));
                } else {
                  throw error;
                }
              }
            }
