name: Spine Export WebM

on:
  repository_dispatch:
    types: [spine-export-webm]
  workflow_dispatch:
    inputs:
      mode:
        description: 'Export mode: missing (only pending entries) or all (re-export all)'
        required: true
        default: 'missing'
        type: choice
        options:
          - missing
          - all
      uploadId:
        description: 'Single upload ID (optional, leave blank to process batch according to mode)'
        required: false
        type: string

jobs:
  export:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Install Playwright with Chromium
        run: |
          echo "=== INSTALLING PLAYWRIGHT ==="
          npm init -y
          npm install playwright@1.59.1
          npx playwright install chromium
          echo "=== PLAYWRIGHT INSTALLED ==="

      - name: Install system dependencies & ffmpeg
        run: |
          echo "=== INSTALLING SYSTEM DEPS ==="
          sudo apt-get update
          sudo apt-get install -y \
            ffmpeg \
            libnss3 libnspr4 libatk1.0-0 libatk-bridge2.0-0 \
            libcups2 libdrm2 libdbus-1-3 libxkbcommon0 \
            libxcomposite1 libxdamage1 libxfixes3 libxrandr2 \
            libgbm1 libpango-1.0-0 libcairo2 libasound2t64 \
            libatspi2.0-0 libwayland-client0 libwayland-cursor0 \
            libwayland-egl1
          echo "=== SYSTEM DEPS INSTALLED ==="

      - name: Run WebM Export (Single or Batch)
        run: |
          echo "=== STARTING EXPORT PROCESS ==="
          uploadId="${{ github.event.client_payload.uploadId || inputs.uploadId }}"
          mode="${{ inputs.mode || 'missing' }}"

          echo "Event: ${{ github.event_name }}"
          echo "Upload ID: $uploadId"
          echo "Mode: $mode"

          if [ -n "$uploadId" ]; then
            echo "Running single entry export for uploadId: $uploadId"
            node scripts/batch-export-all.mjs --upload-id="$uploadId"
          else
            echo "Running batch export with mode: $mode"
            node scripts/batch-export-all.mjs --mode="$mode"
          fi
          echo "=== EXPORT PROCESS COMPLETED ==="

      - name: Commit and push generated WebM files
        run: |
          echo "=== COMMITTING AND PUSHING GENERATED WEBM FILES ==="
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add library/
          if git diff --staged --quiet; then
            echo "No changes to commit."
          else
            git commit -m "Auto-generated WebM previews and updated index"
            git push origin main
          fi
          echo "=== COMPLETED PUSH ==="
