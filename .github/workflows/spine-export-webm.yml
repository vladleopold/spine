name: Spine Export WebM

on:
  repository_dispatch:
    types: [spine-export-webm]

jobs:
  export:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Install Playwright with Chromium
        run: |
          npm init -y
          npm install playwright@1.59.1
          npx playwright install chromium

      - name: Install system dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            libnss3 libnspr4 libatk1.0-0 libatk-bridge2.0-0 \
            libcups2 libdrm2 libdbus-1-3 libxkbcommon0 \
            libxcomposite1 libxdamage1 libxfixes3 libxrandr2 \
            libgbm1 libpango-1.0-0 libcairo2 libasound2t64 \
            libatspi2.0-0 libwayland-client0 libwayland-cursor0 \
            libwayland-egl1

      - name: Export WebM preview
        id: export
        run: |
          node scripts/spine-export-webm.mjs \
            --upload-id="${{ github.event.client_payload.uploadId }}" \
            --animation="${{ github.event.client_payload.animation }}" \
            --origin="${{ github.event.client_payload.origin }}" \
            --owner="${{ github.event.client_payload.owner }}" \
            --repo="${{ github.event.client_payload.repo }}" \
            --branch="${{ github.event.client_payload.branch }}" \
            --repo-path="${{ github.workspace }}" \
            --output="${{ github.workspace }}/${{ github.event.client_payload.uploadId }}-preview.webm"
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Upload webm to GitHub
        id: upload
        uses: actions/github-script@v7
        with:
          script: |
            const fs = require('fs');
            const uploadId = '${{ github.event.client_payload.uploadId }}';
            const basePath = 'library';
            const previewPath = `${basePath}/${uploadId}/preview.webm`;
            const webmPath = `${{ github.workspace }}/${uploadId}-preview.webm`;

            const content = fs.readFileSync(webmPath, 'base64');
            const stats = fs.statSync(webmPath);

            const branch = '${{ github.event.client_payload.branch }}' || 'main';

            async function getSha(path) {
              try {
                const { data } = await github.rest.repos.getContent({
                  owner: context.repo.owner,
                  repo: context.repo.repo,
                  path,
                  ref: branch,
                });
                return data.sha;
              } catch {
                return null;
              }
            }

            const existingSha = await getSha(previewPath);
            const result = await github.rest.repos.createOrUpdateFileContents({
              owner: context.repo.owner,
              repo: context.repo.repo,
              path: previewPath,
              message: `Add WebM preview for ${uploadId}`,
              content,
              branch,
              ...(existingSha ? { sha: existingSha } : {}),
            });

            const webmUrl = '${{ github.event.client_payload.origin }}/assets/${previewPath}';
            console.log(`Uploaded: ${webmUrl} (${stats.size} bytes)`);
            core.setOutput('webm_url', webmUrl);

      - name: Update index entry with webmPreview
        uses: actions/github-script@v7
        with:
          script: |
            const uploadId = '${{ github.event.client_payload.uploadId }}';
            const webmUrl = '${{ steps.upload.outputs.webm_url }}';
            const basePath = 'library';
            const indexPath = `${basePath}/index.json`;

            const branch = '${{ github.event.client_payload.branch }}' || 'main';

            // Use Git Data API (blob) to read index.json because it exceeds 1MB limit
            async function getBlobContent(sha) {
              const { data: blob } = await github.rest.git.getBlob({
                owner: context.repo.owner,
                repo: context.repo.repo,
                file_sha: sha,
              });
              return Buffer.from(blob.content, 'base64').toString('utf8');
            }

            async function getIndexSha() {
              const { data: tree } = await github.rest.git.getTree({
                owner: context.repo.owner,
                repo: context.repo.repo,
                tree_sha: branch,
                recursive: '1',
              });
              const indexEntry = tree.tree.find(t => t.path === 'library/index.json');
              return indexEntry ? indexEntry.sha : null;
            }

            const indexSha = await getIndexSha();
            if (!indexSha) {
              console.log('index.json not found in tree');
              return;
            }

            const content = await getBlobContent(indexSha);
            const entries = JSON.parse(content);
            const entryIndex = entries.findIndex(e => e.id === uploadId);

            if (entryIndex === -1) {
              console.log(`Entry ${uploadId} not found in index, skipping update`);
              return;
            }

            entries[entryIndex] = {
              ...entries[entryIndex],
              webmPreview: '${{ steps.upload.outputs.webm_url }}',
              webmPreviewPath: `library/${uploadId}/preview.webm`,
              webmStatus: 'ready',
              webmGeneratedAt: new Date().toISOString(),
            };

            const newContent = Buffer.from(JSON.stringify(entries, null, 2)).toString('base64');
            const { data: newBlob } = await github.rest.git.createBlob({
              owner: context.repo.owner,
              repo: context.repo.repo,
              content: newContent,
              encoding: 'base64',
            });

            const { data: oldTree } = await github.rest.git.getTree({
              owner: context.repo.owner,
              repo: context.repo.repo,
              tree_sha: branch,
              recursive: '1',
            });

            const newTree = await github.rest.git.createTree({
              owner: context.repo.owner,
              repo: context.repo.repo,
              base_tree: oldTree.sha,
              tree: [
                {
                  path: 'library/index.json',
                  mode: '100644',
                  type: 'blob',
                  sha: newBlob.sha,
                },
              ],
            });

            const newCommit = await github.rest.git.createCommit({
              owner: context.repo.owner,
              repo: context.repo.repo,
              message: `Update WebM preview for ${uploadId}`,
              tree: newTree.sha,
              parents: [branch],
            });

            await github.rest.git.updateRef({
              owner: context.repo.owner,
              repo: context.repo.repo,
              ref: `heads/${branch}`,
              sha: newCommit.sha,
              force: true,
            });

            console.log(`Updated index entry ${uploadId} with webmPreview`);

