name: Spine Export WebM
on:
  repository_dispatch:
    types: [spine-export-webm]
  workflow_dispatch:
    inputs:
      uploadId:
        required: true
        type: string
  push:
    paths: ['scripts/render-check.json']
permissions:
  contents: write
jobs:
  export:
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    concurrency:
      group: spine-render-${{ github.event.client_payload.uploadId || inputs.uploadId || github.run_id }}
      cancel-in-progress: false
    steps:
      - uses: actions/checkout@v4
        with:
          sparse-checkout-cone-mode: false
          sparse-checkout: |
            /scripts/
            /library*/index.json
      - name: Checkout only this work
        id: source
        run: node scripts/prepare-render.mjs
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Install renderer
        if: steps.source.outputs.dispatch_only != 'true'
        run: |
          npm install --no-save playwright@1.59.1
          npx playwright install chromium
          sudo apt-get update -qq
          sudo apt-get install -y -qq ffmpeg webp libnss3 libnspr4 libatk1.0-0 libatk-bridge2.0-0 libcups2 libdrm2 libdbus-1-3 libxkbcommon0 libxcomposite1 libxdamage1 libxfixes3 libxrandr2 libgbm1 libpango-1.0-0 libcairo2 libasound2t64
      - name: Render, validate and publish card and downloads
        run: node scripts/render-work.mjs
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      - name: Keep render verification report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: render-verification-${{ github.run_id }}
          path: render-verification.json
          if-no-files-found: warn
          retention-days: 7
