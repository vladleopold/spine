name: Spine Export WebM

on:
  repository_dispatch:
    types: [spine-export-webm]

jobs:
  export:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Install Playwright with Chromium
        run: |
          echo "=== INSTALLING PLAYWRIGHT ==="
          npm init -y
          npm install playwright@1.59.1
          npx playwright install chromium
          echo "=== PLAYWRIGHT INSTALLED ==="

      - name: Install system dependencies
        run: |
          echo "=== INSTALLING SYSTEM DEPS ==="
          sudo apt-get update
          sudo apt-get install -y \
            libnss3 libnspr4 libatk1.0-0 libatk-bridge2.0-0 \
            libcups2 libdrm2 libdbus-1-3 libxkbcommon0 \
            libxcomposite1 libxdamage1 libxfixes3 libxrandr2 \
            libgbm1 libpango-1.0-0 libcairo2 libasound2t64 \
            libatspi2.0-0 libwayland-client0 libwayland-cursor0 \
            libwayland-egl1
          echo "=== SYSTEM DEPS INSTALLED ==="

      - name: Debug - Check files exist
        run: |
          echo "=== CHECKING FILES ==="
          uploadId="${{ github.event.client_payload.uploadId }}"
          animation="${{ github.event.client_payload.animation }}"
          uploadPath="library/${uploadId}"
          setName="$(ls -1 ${uploadPath} | head -1)"
          echo "Upload ID: $uploadId"
          echo "Animation: $animation"
          echo "Upload Path: $uploadPath"
          echo "Set Name: $setName"
          if [ -d "${uploadPath}/${setName}" ]; then
            echo "Set directory exists"
            ls -la "${uploadPath}/${setName}/"
          else
            echo "ERROR: Set directory not found"
          fi
          echo "=== INDEX.JSON ==="
          if [ -f "library/index.json" ]; then
            echo "index.json exists"
            head -c 500 library/index.json
          else
            echo "ERROR: index.json not found"
          fi

      - name: Export WebM preview
        id: export
        run: |
          echo "=== STARTING EXPORT ==="
          uploadId="${{ github.event.client_payload.uploadId }}"
          animation="${{ github.event.client_payload.animation }}"
          origin="${{ github.event.client_payload.origin }}"
          owner="${{ github.event.client_payload.owner }}"
          repo="${{ github.event.client_payload.repo }}"
          branch="${{ github.event.client_payload.branch }}"
          
          echo "Upload ID: $uploadId"
          echo "Animation: $animation"
          echo "Origin: $origin"
          echo "Owner: $owner"
          echo "Repo: $repo"
          
          node scripts/spine-export-webm.mjs \
            --upload-id="${{ github.event.client_payload.uploadId }}" \
            --animation="${{ github.event.client_payload.animation }}" \
            --origin="${{ github.event.client_payload.origin }}" \
            --owner="${{ github.event.client_payload.owner }}" \
            --repo="${{ github.event.client_payload.repo }}" \
            --branch="${{ github.event.client_payload.branch }}" \
            --repo-path="${{ github.workspace }}" \
            --output="${{ github.workspace }}/${{ github.event.client_payload.uploadId }}-preview.webm"
          echo "=== EXPORT COMPLETED ==="
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Debug - Check output file
        if: always()
        run: |
          echo "=== CHECKING OUTPUT ==="
          uploadId="${{ github.event.client_payload.uploadId }}"
          if [ -f "${{ github.workspace }}/${{ github.event.client_payload.uploadId }}-preview.webm" ]; then
            echo "WebM file exists"
            ls -lh "${{ github.workspace }}/${{ github.event.client_payload.uploadId }}-preview.webm"
          else
            echo "ERROR: WebM file not found"
            ls -la "${{ github.workspace }}/"
          fi

      - name: Upload webm to GitHub
        id: upload
        uses: actions/github-script@v7
        with:
          script: |
            const fs = require('fs');
            const uploadId = '${{ github.event.client_payload.uploadId }}';
            const basePath = 'library';
            const previewPath = `${basePath}/${uploadId}/preview.webm`;
            const webmPath = `${{ github.workspace }}/${uploadId}-preview.webm`;

            console.log("=== UPLOADING WEBM ===");
            console.log("Upload ID:", uploadId);
            console.log("Preview path:", previewPath);
            console.log("WebM path:", webmPath);

            const content = fs.readFileSync(webmPath, 'base64');
            const stats = fs.statSync(webmPath);
            console.log("WebM size:", stats.size, "bytes");

            const branch = '${{ github.event.client_payload.branch }}' || 'main';

            async function getSha(path) {
              try {
                const { data } = await github.rest.repos.getContent({
                  owner: context.repo.owner,
                  repo: context.repo.repo,
                  path,
                  ref: branch,
                });
                return data.sha;
              } catch {
                return null;
              }
            }

            const existingSha = await getSha(previewPath);
            console.log("Existing SHA:", existingSha);

            const result = await github.rest.repos.createOrUpdateFileContents({
              owner: context.repo.owner,
              repo: context.repo.repo,
              path: previewPath,
              message: `Add WebM preview for ${uploadId}`,
              content,
              branch,
              ...(existingSha ? { sha: existingSha } : {}),
            });

            const webmUrl = `${{ github.event.client_payload.origin }}/assets/${previewPath}`;
            console.log(`Uploaded: ${webmUrl} (${stats.size} bytes)`);
            core.setOutput('webm_url', webmUrl);

      - name: Update index entry with webmPreview
        uses: actions/github-script@v7
        with:
          script: |
            const uploadId = '${{ github.event.client_payload.uploadId }}';
            const webmUrl = '${{ steps.upload.outputs.webm_url }}';
            const basePath = 'library';
            const indexPath = `${basePath}/index.json`;

            console.log("=== UPDATING INDEX ===");
            console.log("Upload ID:", uploadId);
            console.log("WebM URL:", webmUrl);

            const branch = '${{ github.event.client_payload.branch }}' || 'main';

            // Use Git Data API (blob) to read index.json because it exceeds 1MB limit
            async function getBlobContent(sha) {
              const { data: blob } = await github.rest.git.getBlob({
                owner: context.repo.owner,
                repo: context.repo.repo,
                file_sha: sha,
              });
              return Buffer.from(blob.content, 'base64').toString('utf8');
            }

            async function getIndexSha() {
              const { data: tree } = await github.rest.git.getTree({
                owner: context.repo.owner,
                repo: context.repo.repo,
                tree_sha: branch,
                recursive: '1',
              });
              const indexEntry = tree.tree.find(t => t.path === 'library/index.json');
              return indexEntry ? indexEntry.sha : null;
            }

            console.log("Getting index SHA...");
            const indexSha = await getIndexSha();
            console.log("Index SHA:", indexSha);
            if (!indexSha) {
              console.log('index.json not found in tree');
              return;
            }

            console.log("Fetching blob content...");
            const content = await getBlobContent(indexSha);
            const entries = JSON.parse(content);
            console.log("Total entries:", entries.length);

            const entryIndex = entries.findIndex(e => e.id === '${{ github.event.client_payload.uploadId }}');
            console.log("Entry index:", entryIndex);

            if (entryIndex === -1) {
              console.log(`Entry not found in index, skipping update`);
              return;
            }

            entries[entryIndex] = {
              ...entries[entryIndex],
              webmPreview: '${{ steps.upload.outputs.webm_url }}',
              webmPreviewPath: `library/${{ github.event.client_payload.uploadId }}/preview.webm`,
              webmStatus: 'ready',
              webmGeneratedAt: new Date().toISOString(),
            };

            const newContent = Buffer.from(JSON.stringify(entries, null, 2)).toString('base64');
            const { data: newBlob } = await github.rest.git.createBlob({
              owner: context.repo.owner,
              repo: context.repo.repo,
              content: newContent,
              encoding: 'base64',
            });

            console.log("Created new blob:", newBlob.sha);

            const { data: oldTree } = await github.rest.git.getTree({
              owner: context.repo.owner,
              repo: context.repo.repo,
              tree_sha: branch,
              recursive: '1',
            });

            const { data: newTree } = await github.rest.git.createTree({
              owner: context.repo.owner,
              repo: context.repo.repo,
              base_tree: oldTree.sha,
              tree: [
                {
                  path: 'library/index.json',
                  mode: '100644',
                  type: 'blob',
                  sha: newBlob.sha,
                },
              ],
            });

            console.log("Created new tree:", newTree.sha);

            const { data: refData } = await github.rest.git.getRef({
              owner: context.repo.owner,
              repo: context.repo.repo,
              ref: `heads/${branch}`,
            });
            const parentSha = refData.object.sha;

            const { data: newCommit } = await github.rest.git.createCommit({
              owner: context.repo.owner,
              repo: context.repo.repo,
              message: `Update WebM preview for ${uploadId}`,
              tree: newTree.sha,
              parents: [parentSha],
            });

            console.log("Created commit:", newCommit.sha);

            await github.rest.git.updateRef({
              owner: context.repo.owner,
              repo: context.repo.repo,
              ref: `heads/${branch}`,
              sha: newCommit.sha,
              force: true,
            });

            console.log(`Updated index entry ${uploadId} with webmPreview`);

