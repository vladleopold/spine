name: Spine Export All (Matrix)

on:
  workflow_dispatch:
    inputs:
      filter_id:
        description: 'Optional ID to filter (leave blank for all)'
        required: false
        default: ''

jobs:
  generate-matrix:
    runs-on: ubuntu-latest
    outputs:
      matrix: ${{ steps.set-matrix.outputs.matrix }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Generate matrix
        id: set-matrix
        run: |
          if [ -n "${{ github.event.inputs.filter_id }}" ]; then
            echo "matrix=[\"${{ github.event.inputs.filter_id }}\"]" >> $GITHUB_OUTPUT
          else
            MATRIX_JSON=$(node -e "const fs = require('fs'); const data = JSON.parse(fs.readFileSync('library/index.json', 'utf8')); console.log(JSON.stringify(data.map(d => d.id).filter(Boolean)));")
            echo "matrix=${MATRIX_JSON}" >> $GITHUB_OUTPUT
          fi

  export:
    needs: generate-matrix
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        uploadId: ${{ fromJson(needs.generate-matrix.outputs.matrix) }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Install Playwright with Chromium
        run: |
          npm init -y
          npm install playwright@1.59.1
          npx playwright install chromium

      - name: Run Export Script
        run: |
          node scripts/spine-export-webm.mjs \
            --upload-id="${{ matrix.uploadId }}" \
            --repo-path="${{ github.workspace }}" \
            --output="${{ github.workspace }}/${{ matrix.uploadId }}-preview.webm"

      - name: Prepare Artifacts
        run: |
          mkdir -p "artifact_${{ matrix.uploadId }}"
          
          # Move generated files to artifact dir if they exist
          for ext in "webm" "webp"; do
            for suffix in "" "-medium" "-low"; do
              f="${{ matrix.uploadId }}-preview${suffix}.${ext}"
              if [ -f "$f" ]; then
                mv "$f" "artifact_${{ matrix.uploadId }}/"
              fi
            done
          done
          
          # Move videoMeta json if it exists
          if [ -f "${{ matrix.uploadId }}-preview.webm.json" ]; then
            mv "${{ matrix.uploadId }}-preview.webm.json" "artifact_${{ matrix.uploadId }}/meta.json"
          else
            echo "{}" > "artifact_${{ matrix.uploadId }}/meta.json"
          fi

      - name: Upload Artifact
        uses: actions/upload-artifact@v4
        with:
          name: export-${{ matrix.uploadId }}
          path: artifact_${{ matrix.uploadId }}/*
          retention-days: 1
          overwrite: true

  commit-all:
    needs: [export]
    runs-on: ubuntu-latest
    if: always()
    permissions:
      contents: write
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      
      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          
      - name: Download all artifacts
        uses: actions/download-artifact@v4
        with:
          path: downloaded-artifacts
          pattern: export-*
          merge-multiple: false
          
      - name: Process artifacts and update index
        uses: actions/github-script@v7
        with:
          script: |
            const fs = require('fs');
            const path = require('path');
            
            const origin = 'https://spine-link.vercel.app';
            const basePath = 'library';
            const indexPath = `${basePath}/index.json`;
            const indexData = JSON.parse(fs.readFileSync(indexPath, 'utf8'));
            
            const artifactsDir = 'downloaded-artifacts';
            if (!fs.existsSync(artifactsDir)) {
              console.log("No artifacts found.");
              return;
            }
            
            const dirs = fs.readdirSync(artifactsDir);
            for (const dir of dirs) {
              const match = dir.match(/^export-(.+)$/);
              if (!match) continue;
              const uploadId = match[1];
              const sourceDir = path.join(artifactsDir, dir);
              const targetDir = path.join(basePath, uploadId);
              
              if (!fs.existsSync(targetDir)) {
                fs.mkdirSync(targetDir, { recursive: true });
              }
              
              // Move files
              const files = fs.readdirSync(sourceDir);
              const uploadedUrls = {};
              let videoMeta = {};
              let isError = false;
              
              for (const file of files) {
                if (file === 'meta.json') {
                  try {
                    videoMeta = JSON.parse(fs.readFileSync(path.join(sourceDir, file), 'utf8'));
                    if (videoMeta.error) isError = true;
                  } catch(e) {}
                  continue;
                }
                
                const cleanFileName = file.replace(uploadId + '-', '');
                const targetPath = path.join(targetDir, cleanFileName);
                fs.copyFileSync(path.join(sourceDir, file), targetPath);
                
                const relativeTarget = `${basePath}/${uploadId}/${cleanFileName}`;
                
                if (file.endsWith('-preview.webm')) uploadedUrls['webmPreview'] = `${origin}/assets/${relativeTarget}`;
                if (file.endsWith('-preview-medium.webm')) uploadedUrls['webmPreviewMedium'] = `${origin}/assets/${relativeTarget}`;
                if (file.endsWith('-preview-low.webm')) uploadedUrls['webmPreviewLow'] = `${origin}/assets/${relativeTarget}`;
                if (file.endsWith('-preview.webp')) uploadedUrls['webpPoster'] = `${origin}/assets/${relativeTarget}`;
                if (file.endsWith('-preview-medium.webp')) uploadedUrls['webpPosterMedium'] = `${origin}/assets/${relativeTarget}`;
                if (file.endsWith('-preview-low.webp')) uploadedUrls['webpPosterLow'] = `${origin}/assets/${relativeTarget}`;
              }
              
              // Update index
              const entryIndex = indexData.findIndex(e => e.id === uploadId);
              if (entryIndex !== -1) {
                delete indexData[entryIndex].webmChunksJson;
                delete indexData[entryIndex].webmChunks;
                delete indexData[entryIndex].webmChunkCount;
                delete indexData[entryIndex].webmIsChunked;
                
                indexData[entryIndex] = {
                  ...indexData[entryIndex],
                  ...uploadedUrls,
                  webmPreviewPath: isError ? undefined : `${basePath}/${uploadId}/preview.webm`,
                  webmStatus: isError ? 'error' : 'ready',
                  webmError: isError ? videoMeta.error : undefined,
                  webmGeneratedAt: new Date().toISOString(),
                  ...(videoMeta.width > 0 ? { previewWidth: videoMeta.width } : {}),
                  ...(videoMeta.height > 0 ? { previewHeight: videoMeta.height } : {}),
                  ...(videoMeta.animationDuration > 0 ? { previewDuration: videoMeta.animationDuration } : {}),
                  ...(videoMeta.skeletonWidth > 0 ? { skeletonWidth: videoMeta.skeletonWidth } : {}),
                  ...(videoMeta.skeletonHeight > 0 ? { skeletonHeight: videoMeta.skeletonHeight } : {}),
                };
              }
            }
            
            fs.writeFileSync(indexPath, JSON.stringify(indexData, null, 2));
            console.log("Updated index.json successfully");

      - name: Commit and Push
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "github-actions[bot]@users.noreply.github.com"
          git add library/
          if ! git diff-index --quiet HEAD --; then
            git commit -m "Auto-export: generate previews and update index"
            
            # Pull with rebase in case something was pushed manually during the jobs
            git pull --rebase origin main
            git push origin main
          else
            echo "No changes to commit."
          fi
