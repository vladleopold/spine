name: Spine Export All (Matrix)

on:
  workflow_dispatch:
    inputs:
      filter_ids:
        description: 'Comma-separated IDs to filter (leave blank for all)'
        required: false
        default: ''

jobs:
  generate-matrix:
    runs-on: ubuntu-latest
    outputs:
      matrix: ${{ steps.set-matrix.outputs.matrix }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Generate matrix
        id: set-matrix
        run: |
          # The library now spans several library_NN folders and holds more works
          # than GitHub's 256-job matrix limit, so ids are grouped into batches
          # and each matrix job exports its whole batch.
          BATCH_SIZE=4
          if [ -n "${{ github.event.inputs.filter_ids }}" ]; then
            # Parse comma-separated IDs into JSON array
            IDS="${{ github.event.inputs.filter_ids }}"
            MATRIX_JSON=$(IDS="$IDS" BATCH_SIZE="$BATCH_SIZE" node -e "
              const ids = process.env.IDS.split(',').map(s => s.trim()).filter(Boolean);
              const size = Number(process.env.BATCH_SIZE) || 1;
              const batches = [];
              for (let i = 0; i < ids.length; i += size) batches.push(ids.slice(i, i + size));
              console.log(JSON.stringify(batches));
            ")
            echo "matrix=${MATRIX_JSON}" >> $GITHUB_OUTPUT
          else
            MATRIX_JSON=$(node --input-type=module -e "
              import { listCollectionFolders, readIndex } from './scripts/resolve-library.mjs';
              const root = process.cwd();
              const ids = [];
              for (const folder of listCollectionFolders(root)) {
                const index = readIndex(root, folder);
                if (!index) continue;
                for (const entry of index) if (entry && entry.id) ids.push(entry.id);
              }
              const size = Number(process.env.BATCH_SIZE) || 1;
              const batches = [];
              for (let i = 0; i < ids.length; i += size) batches.push(ids.slice(i, i + size));
              console.log(JSON.stringify(batches));
            ")
            echo "matrix=${MATRIX_JSON}" >> $GITHUB_OUTPUT
          fi

  export:
    needs: generate-matrix
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        batch: ${{ fromJson(needs.generate-matrix.outputs.matrix) }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Install Playwright with Chromium
        run: |
          npm init -y
          npm install playwright@1.59.1
          npx playwright install chromium --with-deps

      - name: Install system dependencies (GPU + media)
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq \
            libnss3 libnspr4 libatk1.0-0 libatk-bridge2.0-0 \
            libcups2 libdrm2 libdbus-1-3 libxkbcommon0 \
            libxcomposite1 libxdamage1 libxfixes3 libxrandr2 \
            libgbm1 libpango-1.0-0 libcairo2 libasound2t64 webp \
            libatspi2.0-0 libwayland-client0 libwayland-cursor0 \
            libwayland-egl1 ffmpeg

      - name: Run Export Script
        run: |
          # One job exports the whole batch; a work that fails is recorded in
          # its own artifact so the rest of the batch still lands.
          echo '${{ matrix.batch }}' > batch.json
          node -e "
            const fs = require('fs');
            const ids = JSON.parse(fs.readFileSync('batch.json', 'utf8'));
            // Trailing newline matters: `read` silently skips a last line
            // that has no terminator, which would drop one work per batch.
            fs.writeFileSync('batch-ids.txt', ids.map((id) => id + '\n').join(''));
          "
          while IFS= read -r uploadId; do
            [ -z "$uploadId" ] && continue
            echo "=== Exporting $uploadId ==="
            node scripts/spine-export-webm.mjs \
              --upload-id="$uploadId" \
              --repo-path="${{ github.workspace }}" \
              --output="${{ github.workspace }}/$uploadId-preview.webm" || echo "Export failed for $uploadId (recorded as error)"
          done < batch-ids.txt

      - name: Prepare Artifacts
        run: |
          while IFS= read -r uploadId; do
            [ -z "$uploadId" ] && continue
            mkdir -p "batch/$uploadId"
            
            # Move generated files to artifact dir if they exist
            for ext in "webm" "webp"; do
              for suffix in "" "-medium" "-low"; do
                f="$uploadId-preview${suffix}.${ext}"
                if [ -f "$f" ]; then
                  mv "$f" "batch/$uploadId/"
                fi
              done
            done
            
            # Move videoMeta json if it exists
            if [ -f "$uploadId-preview.webm.json" ]; then
              mv "$uploadId-preview.webm.json" "batch/$uploadId/meta.json"
            else
              echo "{}" > "batch/$uploadId/meta.json"
            fi
          done < batch-ids.txt

      - name: Upload Artifact
        uses: actions/upload-artifact@v4
        with:
          name: export-${{ strategy.job-index }}
          path: batch/
          retention-days: 1
          overwrite: true

  commit-all:
    needs: [export]
    runs-on: ubuntu-latest
    if: always()
    permissions:
      contents: write
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      
      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          
      - name: Download all artifacts
        uses: actions/download-artifact@v4
        with:
          path: downloaded-artifacts
          pattern: export-*
          merge-multiple: false
          
      - name: Process artifacts and update index
        uses: actions/github-script@v7
        with:
          script: |
            const fs = require('fs');
            const path = require('path');
            const { entryForUpload } = await import('./scripts/resolve-library.mjs');
            
            const origin = 'https://spine-link.vercel.app';
            const repoRoot = process.cwd();
            // Each work may live in a different library_NN folder, so the folder
            // and its index are resolved per upload and flushed at the end.
            const touchedIndexes = new Map();
            
            const artifactsDir = 'downloaded-artifacts';
            if (!fs.existsSync(artifactsDir)) {
              console.log("No artifacts found.");
              return;
            }
            
            // Each matrix job uploads `export-<n>/<uploadId>/`; older runs used a
            // flat `export-<uploadId>/`, so both layouts are accepted.
            function collectExportDirs(root) {
              const out = [];
              for (const name of fs.readdirSync(root)) {
                const jobDir = path.join(root, name);
                if (!fs.statSync(jobDir).isDirectory()) continue;
                const entries = fs.readdirSync(jobDir);
                if (!entries.length) continue;
                const nested = entries.filter((child) => fs.statSync(path.join(jobDir, child)).isDirectory());
                if (nested.length) {
                  for (const child of nested) out.push({ uploadId: child, sourceDir: path.join(jobDir, child) });
                } else if (/^export-/.test(name)) {
                  out.push({ uploadId: name.replace(/^export-/, ''), sourceDir: jobDir });
                }
              }
              return out;
            }
            
            const dirs = collectExportDirs(artifactsDir);
            for (const { uploadId, sourceDir } of dirs) {
              const found = entryForUpload(repoRoot, uploadId);
              if (!found) {
                console.log(`Skipping ${uploadId}: no collection folder holds it.`);
                continue;
              }
              const basePath = found.basePath;
              const indexPath = path.join(repoRoot, basePath, 'index.json');
              if (!touchedIndexes.has(basePath)) {
                touchedIndexes.set(basePath, { indexPath, indexData: found.index });
              }
              const indexData = touchedIndexes.get(basePath).indexData;
              const targetDir = path.join(basePath, uploadId);
              
              if (!fs.existsSync(targetDir)) {
                fs.mkdirSync(targetDir, { recursive: true });
              }
              
              // Move files
              const files = fs.readdirSync(sourceDir);
              const uploadedUrls = {};
              let videoMeta = {};
              let isError = false;
              
              for (const file of files) {
                if (file === 'meta.json') {
                  try {
                    videoMeta = JSON.parse(fs.readFileSync(path.join(sourceDir, file), 'utf8'));
                    if (videoMeta.error) isError = true;
                  } catch(e) {}
                  continue;
                }
                
                const cleanFileName = file.replace(uploadId + '-', '');
                const targetPath = path.join(targetDir, cleanFileName);
                fs.copyFileSync(path.join(sourceDir, file), targetPath);
                
                const relativeTarget = `${basePath}/${uploadId}/${cleanFileName}`;
                
                if (file.endsWith('-preview.webm')) uploadedUrls['webmPreview'] = `${origin}/assets/${relativeTarget}`;
                if (file.endsWith('-preview-medium.webm')) uploadedUrls['webmPreviewMedium'] = `${origin}/assets/${relativeTarget}`;
                if (file.endsWith('-preview-low.webm')) uploadedUrls['webmPreviewLow'] = `${origin}/assets/${relativeTarget}`;
                if (file.endsWith('-preview.webp')) uploadedUrls['webpPoster'] = `${origin}/assets/${relativeTarget}`;
                if (file.endsWith('-preview-medium.webp')) uploadedUrls['webpPosterMedium'] = `${origin}/assets/${relativeTarget}`;
                if (file.endsWith('-preview-low.webp')) uploadedUrls['webpPosterLow'] = `${origin}/assets/${relativeTarget}`;
              }
              
              // Update index
              const entryIndex = indexData.findIndex(e => e.id === uploadId);
              if (entryIndex !== -1) {
                delete indexData[entryIndex].webmChunksJson;
                delete indexData[entryIndex].webmChunks;
                delete indexData[entryIndex].webmChunkCount;
                delete indexData[entryIndex].webmIsChunked;
                
                indexData[entryIndex] = {
                  ...indexData[entryIndex],
                  ...uploadedUrls,
                  webmPreviewPath: isError ? undefined : `${basePath}/${uploadId}/preview.webm`,
                  webmStatus: isError ? 'error' : 'ready',
                  webmError: isError ? videoMeta.error : undefined,
                  webmGeneratedAt: new Date().toISOString(),
                  ...(videoMeta.width > 0 ? { previewWidth: videoMeta.width } : {}),
                  ...(videoMeta.height > 0 ? { previewHeight: videoMeta.height } : {}),
                  ...(videoMeta.animationDuration > 0 ? { previewDuration: videoMeta.animationDuration } : {}),
                  ...(videoMeta.skeletonWidth > 0 ? { skeletonWidth: videoMeta.skeletonWidth } : {}),
                  ...(videoMeta.skeletonHeight > 0 ? { skeletonHeight: videoMeta.skeletonHeight } : {}),
                };
              }
            }
            
            for (const [basePath, { indexPath, indexData }] of touchedIndexes) {
              fs.writeFileSync(indexPath, JSON.stringify(indexData, null, 2));
              console.log(`Updated ${basePath}/index.json`);
            }
            console.log("Updated index.json successfully");

      - name: Commit and Push
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "github-actions[bot]@users.noreply.github.com"
          
          MAX_RETRIES=20
          for i in $(seq 1 $MAX_RETRIES); do
            echo "Attempt $i/$MAX_RETRIES..."
            
            # 1. Pull latest state from remote first
            git fetch origin main
            git reset --hard origin/main
            
            # 2. Re-run the artifact processing script on top of fresh state
            node --input-type=module -e "
              import fs from 'node:fs';
              import path from 'node:path';
              import { entryForUpload } from './scripts/resolve-library.mjs';
              
              const origin = 'https://spine-link.vercel.app';
              const repoRoot = process.cwd();
              // Each work may live in a different library_NN folder, so the folder
              // and its index are resolved per upload and flushed at the end.
              const touched = new Map();
              
              const artifactsDir = 'downloaded-artifacts';
              if (!fs.existsSync(artifactsDir)) { console.log('No artifacts dir'); process.exit(0); }
              
              // Each matrix job uploads `export-<n>/<uploadId>/`; older runs used
              // a flat `export-<uploadId>/`, so both layouts are accepted.
              function collectExportDirs(root) {
                const out = [];
                for (const name of fs.readdirSync(root)) {
                  const jobDir = path.join(root, name);
                  if (!fs.statSync(jobDir).isDirectory()) continue;
                  const entries = fs.readdirSync(jobDir);
                  if (!entries.length) continue;
                  const nested = entries.filter((child) => fs.statSync(path.join(jobDir, child)).isDirectory());
                  if (nested.length) {
                    for (const child of nested) out.push({ uploadId: child, sourceDir: path.join(jobDir, child) });
                  } else if (/^export-/.test(name)) {
                    out.push({ uploadId: name.replace(/^export-/, ''), sourceDir: jobDir });
                  }
                }
                return out;
              }
              
              const dirs = collectExportDirs(artifactsDir);
              for (const { uploadId, sourceDir } of dirs) {
                const found = entryForUpload(repoRoot, uploadId);
                if (!found) { console.log('Skipping ' + uploadId + ': not in any collection.'); continue; }
                const basePath = found.basePath;
                const indexPath = path.join(repoRoot, basePath, 'index.json');
                if (!touched.has(basePath)) touched.set(basePath, { indexPath, indexData: found.index });
                const indexData = touched.get(basePath).indexData;
                const targetDir = path.join(basePath, uploadId);
                
                if (!fs.existsSync(targetDir)) fs.mkdirSync(targetDir, { recursive: true });
                
                const files = fs.readdirSync(sourceDir);
                const uploadedUrls = {};
                let videoMeta = {};
                let isError = false;
                
                for (const file of files) {
                  if (file === 'meta.json') {
                    try { videoMeta = JSON.parse(fs.readFileSync(path.join(sourceDir, file), 'utf8')); if (videoMeta.error) isError = true; } catch(e) {}
                    continue;
                  }
                  const cleanFileName = file.replace(uploadId + '-', '');
                  const targetPath = path.join(targetDir, cleanFileName);
                  fs.copyFileSync(path.join(sourceDir, file), targetPath);
                  const relativeTarget = \`\${basePath}/\${uploadId}/\${cleanFileName}\`;
                  if (file.endsWith('-preview.webm')) uploadedUrls['webmPreview'] = \`\${origin}/assets/\${relativeTarget}\`;
                  if (file.endsWith('-preview-medium.webm')) uploadedUrls['webmPreviewMedium'] = \`\${origin}/assets/\${relativeTarget}\`;
                  if (file.endsWith('-preview-low.webm')) uploadedUrls['webmPreviewLow'] = \`\${origin}/assets/\${relativeTarget}\`;
                  if (file.endsWith('-preview.webp')) uploadedUrls['webpPoster'] = \`\${origin}/assets/\${relativeTarget}\`;
                  if (file.endsWith('-preview-medium.webp')) uploadedUrls['webpPosterMedium'] = \`\${origin}/assets/\${relativeTarget}\`;
                  if (file.endsWith('-preview-low.webp')) uploadedUrls['webpPosterLow'] = \`\${origin}/assets/\${relativeTarget}\`;
                }
                
                const entryIndex = indexData.findIndex(e => e.id === uploadId);
                if (entryIndex !== -1) {
                  delete indexData[entryIndex].webmChunksJson;
                  delete indexData[entryIndex].webmChunks;
                  delete indexData[entryIndex].webmChunkCount;
                  delete indexData[entryIndex].webmIsChunked;
                  indexData[entryIndex] = {
                    ...indexData[entryIndex],
                    ...uploadedUrls,
                    webmPreviewPath: isError ? undefined : \`\${basePath}/\${uploadId}/preview.webm\`,
                    webmStatus: isError ? 'error' : 'ready',
                    webmError: isError ? videoMeta.error : undefined,
                    webmGeneratedAt: new Date().toISOString(),
                    ...(videoMeta.width > 0 ? { previewWidth: videoMeta.width } : {}),
                    ...(videoMeta.height > 0 ? { previewHeight: videoMeta.height } : {}),
                    ...(videoMeta.animationDuration > 0 ? { previewDuration: videoMeta.animationDuration } : {}),
                    ...(videoMeta.skeletonWidth > 0 ? { skeletonWidth: videoMeta.skeletonWidth } : {}),
                    ...(videoMeta.skeletonHeight > 0 ? { skeletonHeight: videoMeta.skeletonHeight } : {}),
                  };
                }
              }
              for (const [basePath, { indexPath, indexData }] of touched) {
                fs.writeFileSync(indexPath, JSON.stringify(indexData, null, 2));
                console.log('updated ' + basePath + '/index.json');
              }
            "
            
            # 3. Stage changes
            git add library_*/ library/
            
            if git diff-index --quiet HEAD --; then
              echo "No changes to commit."
              exit 0
            fi
            
            # 4. Commit
            git commit -m "Auto-export: generate previews and update index"
            
            # 5. Push — if rejected, loop back and retry with fresh HEAD
            if git push origin main; then
              echo "Successfully pushed on attempt $i!"
              exit 0
            else
              echo "Push rejected. Will retry with fresh HEAD..."
              sleep $((RANDOM % 5 + 2))
            fi
          done
          
          echo "Failed to push after $MAX_RETRIES attempts."
          exit 1
