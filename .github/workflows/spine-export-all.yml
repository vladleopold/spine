name: Spine Export All (Matrix)

on:
  workflow_dispatch:
    inputs:
      filter_id:
        description: 'Optional ID to filter (leave blank for all)'
        required: false
        default: ''

jobs:
  generate-matrix:
    runs-on: ubuntu-latest
    outputs:
      matrix: ${{ steps.set-matrix.outputs.matrix }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Generate matrix
        id: set-matrix
        run: |
          if [ -n "${{ github.event.inputs.filter_id }}" ]; then
            echo "matrix=[\"${{ github.event.inputs.filter_id }}\"]" >> $GITHUB_OUTPUT
          else
            MATRIX_JSON=$(node -e "const fs = require('fs'); const data = JSON.parse(fs.readFileSync('library/index.json', 'utf8')); console.log(JSON.stringify(data.map(d => d.id).filter(Boolean)));")
            echo "matrix=${MATRIX_JSON}" >> $GITHUB_OUTPUT
          fi

  export:
    needs: generate-matrix
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        uploadId: ${{ fromJson(needs.generate-matrix.outputs.matrix) }}
    permissions:
      contents: write
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Install Playwright with Chromium
        run: |
          npm init -y
          npm install playwright@1.59.1
          npx playwright install chromium

      - name: Run Export Script
        run: |
          node scripts/spine-export-webm.mjs \
            --upload-id="${{ matrix.uploadId }}" \
            --repo-path="${{ github.workspace }}" \
            --output="${{ github.workspace }}/${{ matrix.uploadId }}-preview.webm"
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Upload media and update index atomically
        id: upload_and_update
        uses: actions/github-script@v7
        with:
          script: |
            const fs = require('fs');
            const uploadId = '${{ matrix.uploadId }}';
            const basePath = 'library';
            const branch = 'main';
            const origin = 'https://spine-link.vercel.app';
            const workspace = '${{ github.workspace }}';
            const indexPath = `${basePath}/index.json`;
            const metaPath = `${workspace}/${uploadId}-preview.webm.json`;

            const filesToUpload = [
              { source: `${workspace}/${uploadId}-preview.webm`, target: `${basePath}/${uploadId}/preview.webm`, key: 'webmPreview' },
              { source: `${workspace}/${uploadId}-preview-medium.webm`, target: `${basePath}/${uploadId}/preview-medium.webm`, key: 'webmPreviewMedium' },
              { source: `${workspace}/${uploadId}-preview-low.webm`, target: `${basePath}/${uploadId}/preview-low.webm`, key: 'webmPreviewLow' },
              { source: `${workspace}/${uploadId}-preview.webp`, target: `${basePath}/${uploadId}/preview.webp`, key: 'webpPoster' },
              { source: `${workspace}/${uploadId}-preview-medium.webp`, target: `${basePath}/${uploadId}/preview-medium.webp`, key: 'webpPosterMedium' },
              { source: `${workspace}/${uploadId}-preview-low.webp`, target: `${basePath}/${uploadId}/preview-low.webp`, key: 'webpPosterLow' }
            ];

            // 1. Create blobs for all media files up-front (no race condition — blobs are content-addressed)
            const newBlobs = [];
            const uploadedUrls = {};
            for (const file of filesToUpload) {
              if (fs.existsSync(file.source)) {
                console.log(`Creating blob for ${file.target}...`);
                const content = fs.readFileSync(file.source, 'base64');
                const { data: blob } = await github.rest.git.createBlob({
                  owner: context.repo.owner, repo: context.repo.repo, content, encoding: 'base64',
                });
                newBlobs.push({ path: file.target, mode: '100644', type: 'blob', sha: blob.sha });
                uploadedUrls[file.key] = `${origin}/assets/${file.target}`;
              }
            }

            // 2. Read metadata if exists
            let videoMeta = {};
            if (fs.existsSync(metaPath)) {
              try { videoMeta = JSON.parse(fs.readFileSync(metaPath, 'utf8')); } catch (err) {}
            }

            async function getBlobContent(sha) {
              const { data: blob } = await github.rest.git.getBlob({
                owner: context.repo.owner, repo: context.repo.repo, file_sha: sha,
              });
              return Buffer.from(blob.content, 'base64').toString('utf8');
            }

            // 3. Atomic retry loop: read latest HEAD → build tree → fast-forward push
            // KEY: force:false so parallel jobs serialise naturally. On 409/422 we back off and retry with fresh HEAD.
            const MAX_RETRIES = 30;
            for (let i = 1; i <= MAX_RETRIES; i++) {
              try {
                // Always fetch the very latest ref before building the commit
                const { data: refData } = await github.rest.git.getRef({
                  owner: context.repo.owner, repo: context.repo.repo, ref: `heads/${branch}`,
                });
                const latestSha = refData.object.sha;

                const { data: oldTree } = await github.rest.git.getTree({
                  owner: context.repo.owner, repo: context.repo.repo, tree_sha: latestSha, recursive: '1',
                });
                const indexEntry = oldTree.tree.find(t => t.path === indexPath);
                if (!indexEntry) { console.log('index.json not found in tree'); return; }

                // Update index.json
                const content = await getBlobContent(indexEntry.sha);
                const entries = JSON.parse(content);
                const entryIndex = entries.findIndex(e => e.id === uploadId);
                if (entryIndex !== -1) {
                  delete entries[entryIndex].webmChunksJson;
                  delete entries[entryIndex].webmChunks;
                  delete entries[entryIndex].webmChunkCount;
                  delete entries[entryIndex].webmIsChunked;

                  const isError = !!videoMeta.error;
                  entries[entryIndex] = {
                    ...entries[entryIndex],
                    ...uploadedUrls,
                    webmPreviewPath: isError ? undefined : `${basePath}/${uploadId}/preview.webm`,
                    webmStatus: isError ? 'error' : 'ready',
                    webmError: isError ? videoMeta.error : undefined,
                    webmGeneratedAt: new Date().toISOString(),
                    ...(videoMeta.width > 0 ? { previewWidth: videoMeta.width } : {}),
                    ...(videoMeta.height > 0 ? { previewHeight: videoMeta.height } : {}),
                    ...(videoMeta.animationDuration > 0 ? { previewDuration: videoMeta.animationDuration } : {}),
                    ...(videoMeta.skeletonWidth > 0 ? { skeletonWidth: videoMeta.skeletonWidth } : {}),
                    ...(videoMeta.skeletonHeight > 0 ? { skeletonHeight: videoMeta.skeletonHeight } : {}),
                  };
                }

                const newIndexContent = Buffer.from(JSON.stringify(entries, null, 2)).toString('base64');
                const { data: indexBlob } = await github.rest.git.createBlob({
                  owner: context.repo.owner, repo: context.repo.repo, content: newIndexContent, encoding: 'base64',
                });

                const { data: newTree } = await github.rest.git.createTree({
                  owner: context.repo.owner, repo: context.repo.repo, base_tree: latestSha,
                  tree: [...newBlobs, { path: indexPath, mode: '100644', type: 'blob', sha: indexBlob.sha }],
                });

                const { data: newCommit } = await github.rest.git.createCommit({
                  owner: context.repo.owner, repo: context.repo.repo,
                  message: `Add media & update index for ${uploadId}`,
                  tree: newTree.sha, parents: [latestSha],
                });

                // NO force:true — fast-forward only. Parallel jobs that lose the race retry with fresh HEAD.
                await github.rest.git.updateRef({
                  owner: context.repo.owner, repo: context.repo.repo,
                  ref: `heads/${branch}`, sha: newCommit.sha, force: false,
                });

                console.log(`Successfully committed media + index for ${uploadId} on try ${i}`);
                break;
              } catch (error) {
                const isConflict = error.status === 409 || error.status === 422 ||
                  (error.message && (error.message.includes('not a fast forward') || error.message.includes('Update is not a fast forward') || error.message.includes('is at')));
                if (isConflict) {
                  console.log(`Conflict on try ${i}/${MAX_RETRIES}, backing off...`);
                  if (i === MAX_RETRIES) throw error;
                  // Exponential backoff with jitter (caps at 30s)
                  const delay = Math.min(1000 * Math.pow(1.5, i), 30000) + Math.floor(Math.random() * 3000);
                  await new Promise(resolve => setTimeout(resolve, delay));
                } else {
                  throw error;
                }
              }
            }
