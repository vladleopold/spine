name: Trim Black First Frames

# One-off cleanup: existing previews were recorded while the canvas was still
# blank, so each clip starts with a run of background-only frames and any
# poster taken from frame 0 is black. This cuts that leading black run and
# re-takes the posters from the new frame 0. Future renders do not need it:
# spine-export-webm.mjs only starts MediaRecorder after the canvas has settled
# and the first frame is verified to have content.
on:
  workflow_dispatch:
    inputs:
      shard:
        description: 'Shard as I/N (e.g. 1/8). Leave empty to run all shards.'
        required: false
        default: ''
      posters:
        description: 'Rewrite WebP posters after trimming (1 = yes)'
        required: false
        default: '1'
      limit:
        description: 'Max files to trim (0 = no limit)'
        required: false
        default: '0'

jobs:
  trim:
    permissions:
      contents: write
    runs-on: ubuntu-latest
    timeout-minutes: 360
    strategy:
      fail-fast: false
      max-parallel: 10
      matrix:
        shard: ['0/10', '1/10', '2/10', '3/10', '4/10', '5/10', '6/10', '7/10', '8/10', '9/10']
    steps:
      - uses: actions/checkout@v4
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
          # Full history is not needed, but the current library is: the
          # checkout must include every preview so the scan sees all of them.
          fetch-depth: 1

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Install ffmpeg
        run: |
          sudo apt-get update -qq
          # `cwebp` comes from the `webp` package; the bare name is not a package.
          sudo apt-get install -y -qq ffmpeg webp imagemagick

      - name: Trim black leading frames
        env:
          ONLY_SHARD: ${{ inputs.shard }}
          POSTERS: ${{ inputs.posters }}
          LIMIT: ${{ inputs.limit }}
        run: |
          set -euo pipefail
          SHARD="$ONLY_SHARD"
          if [ -n "$SHARD" ]; then
            SHARD_ARG="--shard $SHARD"
          else
            SHARD_ARG="--shard ${{ matrix.shard }}"
          fi
          POSTER_ARG=""
          if [ "$POSTERS" = "1" ]; then
            POSTER_ARG="--posters"
          fi
          LIMIT_ARG=""
          if [ "$LIMIT" != "0" ] && [ -n "$LIMIT" ]; then
            LIMIT_ARG="--limit $LIMIT"
          fi
          echo "Running: node scripts/trim-first-frame.mjs $SHARD_ARG $POSTER_ARG $LIMIT_ARG"
          node scripts/trim-first-frame.mjs $SHARD_ARG $POSTER_ARG $LIMIT_ARG

      - name: Commit and push
        env:
          SHARD: ${{ matrix.shard }}
          POSTERS: ${{ inputs.posters }}
        run: |
          POSTER_ARG=""
          if [ "$POSTERS" = "1" ]; then
            POSTER_ARG="--posters"
          fi
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          commit_and_push() {
            git add library/
            if git diff --cached --quiet; then
              return 1
            fi
            git commit -m "Trim black leading frames from previews (shard ${SHARD})" || return 1
            git push origin HEAD:main
          }
          for i in $(seq 1 30); do
            if commit_and_push; then
              echo "Pushed on attempt $i"
              exit 0
            fi
            echo "Push rejected (attempt $i), rebuilding this shard on top of origin/main..."
            sleep $((RANDOM % 5 + 3))
            git fetch origin main
            git reset --hard origin/main
            # Re-run the trim. Files trimmed by the previous attempt now start
            # on a visible frame, so they are skipped; anything still black
            # (including files other shards just committed) is picked up.
            node scripts/trim-first-frame.mjs --shard "${SHARD}" $POSTER_ARG
          done
          echo "Failed to push after 30 attempts"
          exit 1
