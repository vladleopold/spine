name: Verify production previews for all 18 reported Spine works
on:
  schedule:
    - cron: '29 * * * *'
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: reported-preview-production-audit
  cancel-in-progress: false
jobs:
  production-audit:
    runs-on: ubuntu-24.04
    timeout-minutes: 18
    steps:
      - uses: actions/checkout@v4
        with:
          sparse-checkout-cone-mode: false
          sparse-checkout: |
            /.github/workflows/repair-reported-previews.yml
            /.github/workflows/verify-reported-preview-live.yml
            /scripts/resolve-library.mjs
            /scripts/verify-reported-preview-live.mjs
            /scripts/lib/reported-preview-live-status.mjs
            /scripts/lib/reported-preview-media.mjs
            /scripts/lib/first-frame-poster.mjs
            /scripts/test-reported-preview-live.mjs
            /scripts/test-reported-preview-live-workflow.mjs
            /scripts/verify-preview-motion.mjs
            /scripts/verify-poster-first-frame.mjs
            /library_02/index.json
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Install FFmpeg for actual media decoding
        shell: bash
        run: |
          set -euo pipefail
          if ! command -v ffmpeg >/dev/null 2>&1 || ! command -v ffprobe >/dev/null 2>&1; then
            sudo apt-get update -qq
            sudo apt-get install -y -qq --no-install-recommends ffmpeg
          fi
          ffmpeg -version | head -n 1
          ffprobe -version | head -n 1
      - name: Verify sparse checkout and media acceptance contracts
        run: |
          node --check scripts/verify-reported-preview-live.mjs
          node scripts/test-reported-preview-live.mjs
          node scripts/test-reported-preview-live-workflow.mjs
      - name: Verify real bytes, poster decode, first-frame match and moving WebM frames
        run: node scripts/verify-reported-preview-live.mjs
