name: Verify production previews for 18 reported + priority Spine works
on:
  schedule:
    - cron: '29 * * * *'
  workflow_run:
    workflows: ["Repair and accept 18 reported + priority Spine preview projects"]
    types: [completed]
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: reported-preview-production-audit
  cancel-in-progress: false
jobs:
  production-audit:
    if: github.event_name != 'workflow_run' || (github.event.workflow_run.event != 'pull_request' && github.event.workflow_run.conclusion == 'success')
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
        with:
          sparse-checkout-cone-mode: false
          sparse-checkout: |
            /scripts/resolve-library.mjs
            /scripts/verify-reported-preview-live.mjs
            /scripts/lib/reported-preview-media.mjs
            /scripts/lib/reported-preview-live-status.mjs
            /scripts/test-reported-preview-live.mjs
            /scripts/verify-preview-motion.mjs
            /scripts/verify-poster-first-frame.mjs
            /scripts/lib/first-frame-poster.mjs
            /library_02/index.json
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Install FFmpeg for actual media decoding
        shell: bash
        run: |
          set -euo pipefail
          if ! command -v ffmpeg >/dev/null 2>&1 || ! command -v ffprobe >/dev/null 2>&1; then
            sudo apt-get update -qq
            sudo apt-get install -y -qq --no-install-recommends ffmpeg
          fi
          ffmpeg -version | head -n 1
          ffprobe -version | head -n 1
      - name: Verify exact animation, all media tiers, decoded posters and real moving frames
        run: |
          node --check scripts/verify-reported-preview-live.mjs
          node scripts/test-reported-preview-live.mjs
          node scripts/verify-reported-preview-live.mjs
