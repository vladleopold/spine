name: Publish independently verified Spine preview artifacts
on:
  push:
    branches: [main]
    paths:
      - .github/workflows/publish-verified-preview-artifacts.yml
  workflow_dispatch:
permissions:
  contents: write
  actions: read
concurrency:
  group: spine-library-commit
  cancel-in-progress: false
jobs:
  publish:
    runs-on: ubuntu-24.04
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
        with:
          sparse-checkout-cone-mode: false
          sparse-checkout: |
            /scripts/
            /library_02/index.json
            /library_02/Spine-animation-2026-11-17T18-45-14-132Z/preview*.webm
            /library_02/Spine-animation-2026-11-17T18-45-14-132Z/preview*.webp
            /library_02/Spine-animation-2026-11-17T18-44-12-762Z/preview*.webm
            /library_02/Spine-animation-2026-11-17T18-44-12-762Z/preview*.webp
            /library_02/Spine-animation-2026-11-17T18-39-06-745Z/preview*.webm
            /library_02/Spine-animation-2026-11-17T18-39-06-745Z/preview*.webp
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - uses: actions/download-artifact@v4
        with:
          run-id: 44327620824
          github-token: \${{ secrets.GITHUB_TOKEN }}
          pattern: latest10-*
          path: downloaded-latest10
          merge-multiple: false
      - name: Publish only independently verified real video and posters
        shell: bash
        run: |
          set -euo pipefail
          node --check scripts/publish-verified-preview-artifacts.mjs
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          for attempt in 1 2 3 4; do
            git fetch --no-tags origin +refs/heads/main:refs/remotes/origin/main
            git reset --hard refs/remotes/origin/main
            node scripts/publish-verified-preview-artifacts.mjs
            git add --sparse -A -- library_02/index.json \
              library_02/Spine-animation-2026-11-17T18-45-14-132Z/ \
              library_02/Spine-animation-2026-11-17T18-44-12-762Z/ \
              library_02/Spine-animation-2026-11-17T18-39-06-745Z/
            if git diff --cached --quiet; then
              echo 'VERIFIED_MEDIA_ALREADY_PUBLISHED'
              exit 0
            fi
            git commit -m 'fix: publish independently validated recent Spine WebM and WebP previews'
            if git push origin HEAD:main; then
              echo 'VERIFIED_PREVIEW_ASSETS_PUBLISHED'
              exit 0
            fi
            sleep $((attempt * 2))
          done
          echo '::error::Failed to publish validated Spine previews'
          exit 1
      - name: Verify actual production media response
        shell: bash
        run: |
          set -euo pipefail
          node --input-type=module <<'NODE'
          const ids=[
            'Spine-animation-2026-11-17T18-44-12-762Z',
            'Spine-animation-2026-11-17T18-45-14-132Z',
          ];
          for(const id of ids){
            for(const ext of ['webm','webp']){
              const url='https://spine-link.vercel.app/assets/library_02/'+id+'/preview.'+ext+'?v=verified-repair-20261118';
              let passed=false,code=0,bytes=0;
              for(let attempt=0;attempt<6;attempt++){
                try {
                  const response=await fetch(url,{signal:AbortSignal.timeout(14000),cache:'no-store'});
                  code=response.status;
                  if(response.ok){
                    const data=new Uint8Array(await response.arrayBuffer());
                    bytes=data.byteLength;
                    const valid=ext==='webm'?data[0]===26&&data[1]===69&&data[2]===223&&data[3]===163:
                      String.fromCharCode(...data.slice(0,4))==='RIFF'&&String.fromCharCode(...data.slice(8,12))==='WEBP';
                    if(valid&&bytes>128){passed=true;break;}
                  }
                }catch{}
                await new Promise(r=>setTimeout(r,5000));
              }
              console.log('PRODUCTION_MEDIA_CHECK',id,ext,'HTTP',code,'bytes',bytes,'verified',passed);
              if(!passed)process.exitCode=1;
            }
          }
          NODE
