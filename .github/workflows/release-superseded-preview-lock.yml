name: Release superseded preview publisher lock
on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/release-superseded-preview-lock.yml'
permissions:
  actions: write
  contents: read
jobs:
  release-stale-lock:
    runs-on: ubuntu-24.04
    timeout-minutes: 4
    steps:
      - name: Cancel only the replaced publisher run
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          old_run=44350945875
          status=$(gh api "repos/$GITHUB_REPOSITORY/actions/runs/$old_run" --jq '.status')
          if [[ "$status" == "completed" ]]; then
            echo "Superseded job already finished."
            exit 0
          fi
          [[ "$status" == "queued" || "$status" == "in_progress" || "$status" == "pending" ]] || exit 1
          gh api -X POST "repos/$GITHUB_REPOSITORY/actions/runs/$old_run/cancel"
          echo "SUPERSEDED_PREVIEW_JOB_CANCEL_REQUESTED=$old_run"
