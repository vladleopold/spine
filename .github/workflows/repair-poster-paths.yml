name: Repair Poster Paths

# `thumbnail` and `thumbnailPoster` are written at upload time as absolute
# /assets/ URLs pointing at whichever per-animation poster the exporter made.
# Nothing removes those files, so a later re-export leaves the index pointing at
# a 404 and the card renders empty. This workflow repoints every such field at
# the canonical preview.webp the exporter writes for every entry.
#
# It is a single unsharded job on purpose: all of it edits one shared
# library/index.json, so it must never run concurrently with itself.

on:
  workflow_dispatch:
  schedule:
    # Weekly, early UTC Monday -- catches drift introduced by new uploads.
    - cron: "17 4 * * 1"

permissions:
  contents: write

concurrency:
  group: repair-poster-paths

jobs:
  repair:
    name: Repoint dead poster paths
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 1

      - name: Repair poster paths
        run: node scripts/repair-poster-paths.mjs

      - name: Commit repaired index
        run: |
          set -euo pipefail
          if [ -z "$(git status --porcelain library/index.json)" ]; then
            echo "library/index.json unchanged; nothing to commit."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add library/index.json
          git commit -m "Repair poster paths pointing at deleted files"
          # The index is 20 MB, so rebasing it onto a moved main is only
          # practical if nothing else touched it; retry a few times.
          for i in 1 2 3 4 5; do
            if git push origin HEAD:main; then
              echo "Pushed on attempt $i"
              exit 0
            fi
            echo "Push rejected (attempt $i), rebuilding on top of origin/main..."
            sleep $((RANDOM % 5 + 3))
            git fetch origin main
            git rebase origin/main || { echo "Rebase conflict on library/index.json; stopping."; exit 1; }
          done
          echo "Could not push after 5 attempts."
          exit 1
