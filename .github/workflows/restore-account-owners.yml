name: Restore saved account ownership
on:
  push:
    paths: ['scripts/restore-account-owners.mjs']
  workflow_dispatch:
permissions:
  contents: write
jobs:
  restore:
    runs-on: ubuntu-24.04
    concurrency:
      group: spine-library-commit
      cancel-in-progress: false
    steps:
      - uses: actions/checkout@v4
        with:
          sparse-checkout-cone-mode: false
          sparse-checkout: |
            /scripts/
            /library*/index.json
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Restore only ownership proven by original upload records
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email 'github-actions[bot]@users.noreply.github.com'
          for attempt in 1 2 3 4 5; do
            git fetch origin +refs/heads/main:refs/remotes/origin/main
            git reset --hard origin/main
            node scripts/restore-account-owners.mjs
            git add 'library*/index.json'
            if git diff --cached --quiet; then exit 0; fi
            git commit -m 'Restore original anonymous owners from verified upload records'
            if git push origin HEAD:main; then exit 0; fi
          done
          exit 1
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: ownership-recovery-summary
          path: /tmp/ownership-recovery-summary.json
          retention-days: 7
