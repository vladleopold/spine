name: Free video formats (all accounts)
on:
  workflow_dispatch:
    inputs:
      upload_id:
        description: "Spine upload ID"
        required: true
      hevc:
        description: "Also encode Apple HEVC"
        type: boolean
        default: true
permissions:
  contents: read
jobs:
  formats:
    runs-on: ubuntu-latest
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Install browser and encoder
        run: |
          npm init -y
          npm install playwright@1.59.1
          npx playwright install chromium --with-deps
          sudo apt-get update -qq
          sudo apt-get install -y ffmpeg
      - name: Generate source
        env:
          UPLOAD_ID: ${{ inputs.upload_id }}
        run: |
          node scripts/spine-export-webm.mjs --upload-id="$UPLOAD_ID" --repo-path="$GITHUB_WORKSPACE" --output="$RUNNER_TEMP/source.webm"
      - name: Encode formats
        env:
          HEVC: ${{ inputs.hevc }}
        run: |
          if [ "$HEVC" = "true" ]; then
            node scripts/export-free-video-ladder.mjs "$RUNNER_TEMP/source.webm" "$RUNNER_TEMP/formats" --hevc
          else
            node scripts/export-free-video-ladder.mjs "$RUNNER_TEMP/source.webm" "$RUNNER_TEMP/formats"
          fi
      - uses: actions/upload-artifact@v4
        with:
          name: free-video-formats-${{ inputs.upload_id }}
          path: ${{ runner.temp }}/formats/
          retention-days: 7
