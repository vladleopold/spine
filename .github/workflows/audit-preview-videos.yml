name: Audit and repair Spine preview FPS
on:
  schedule:
    - cron: '17 3 * * 0'
  workflow_dispatch:
    inputs:
      repair:
        description: 'Transcode valid motion clips below 30 FPS (false = audit only)'
        required: true
        type: boolean
        default: false
permissions:
  contents: write
  actions: write
concurrency:
  group: spine-preview-audit
  cancel-in-progress: false
jobs:
  audit:
    runs-on: ubuntu-latest
    timeout-minutes: 360
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 1
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Install ffmpeg
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq ffmpeg
      - name: Audit previews and optionally repair FPS
        run: |
          if [ "${{ github.event_name }}" = "schedule" ] || [ "${{ inputs.repair }}" = "true" ]; then
            node scripts/audit-preview-videos.mjs --repair
          else
            node scripts/audit-preview-videos.mjs
          fi
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: preview-audit-report
          path: preview-audit-report.json
          retention-days: 30
      - name: Commit verified repairs
        if: ${{ github.event_name == 'schedule' || inputs.repair }}
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add library/ library_*/ || true
          if ! git diff --cached --quiet; then
            git commit -m "Repair low-FPS WebM previews and update metadata"
            git push origin HEAD:main
          fi

      - name: Request missing or invalid previews from the Spine exporter
        if: ${{ github.event_name == 'schedule' || inputs.repair }}
        uses: actions/github-script@v7
        with:
          script: |
            const fs = require('fs');
            const report = JSON.parse(fs.readFileSync('preview-audit-report.json','utf8'));
            const ids = [...new Set([
              ...report.missing,
              ...report.invalid.map(x => x.id),
              ...report.errors.map(x => x.id)
            ])].filter(Boolean);
            // Re-export in small batches to respect workflow input size and
            // avoid exhausting the 256-job matrix in spine-export-all.yml.
            for (let i = 0; i < ids.length; i += 32) {
              await github.rest.actions.createWorkflowDispatch({
                owner: context.repo.owner,
                repo: context.repo.repo,
                workflow_id: 'spine-export-all.yml',
                ref: 'main',
                inputs: { filter_ids: ids.slice(i, i + 32).join(',') }
              });
              core.info('Requested re-export of ' + ids.slice(i, i + 32).length + ' previews');
            }
