name: Regenerate WebP Posters

on:
  repository_dispatch:
    types: [regenerate-webp]
  workflow_dispatch:
    inputs:
      entry_id:
        description: 'Entry ID to regenerate (leave empty for all)'
        required: false
        default: ''

jobs:
  regenerate:
    permissions:
      contents: write
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          token: ${{ secrets.GITHUB_TOKEN }}

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Install ffmpeg
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq ffmpeg

      - name: Generate WebP from WebM
        run: node scripts/regenerate-webp.mjs

      - name: Commit and push
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add library/
          if git diff --cached --quiet; then
            echo "No changes to commit"
          else
            git commit -m "Regenerate WebP posters from WebM videos"
            for i in $(seq 1 20); do
              git push origin main && break
              echo "Push rejected (attempt $i), retrying..."
              sleep $((RANDOM % 5 + 2))
              git fetch origin main
              git reset --hard origin/main
              git add library/
              git commit -m "Regenerate WebP posters from WebM videos"
            done
          fi
