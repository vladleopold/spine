name: Private missing-atlas geometry (no images or artifacts)
on:
  push:
    branches: [fix/atlas-inference-boss-20261118]
    paths: [scripts/diagnose-missing-atlas.mjs, scripts/run-atlas-inference.mjs, lib/atlas-inference.js, .github/workflows/missing-atlas-diagnostics.yml]
  workflow_dispatch:
permissions:
  contents: read
jobs:
  metadata:
    runs-on: ubuntu-24.04
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v4
        with:
          sparse-checkout: |
            scripts/diagnose-missing-atlas.mjs
            scripts/run-atlas-inference.mjs
            lib/atlas-inference.js
            library_02/boss_1-2026-11-14T20-07-17-943Z
            package.json
          sparse-checkout-cone-mode: false
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Install PNG decoder for local memory only
        run: npm install --no-save --ignore-scripts --no-package-lock pngjs@7.0.0
      - name: Check inferred atlas region coverage and rotations without NDA data
        run: node scripts/run-atlas-inference.mjs
