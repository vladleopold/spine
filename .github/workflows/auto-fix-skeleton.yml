name: Auto-Fix Skeleton Errors

on:
  push:
    paths:
      - 'library/**/*.json'
      - 'library/**/*.atlas'
      - 'library/**/*.png'
      - 'library/**/*.webm'
  workflow_dispatch:
    inputs:
      uploadId:
        description: 'Upload ID to fix'
        required: false
        type: string

jobs:
  validate-and-fix:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      
      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          
      - name: Install dependencies
        run: |
          npm init -y
          npm install playwright@1.59.1
          npx playwright install chromium
          
      - name: Validate and fix skeleton files
        id: fix
        run: |
          node scripts/validate-and-fix-skeletons.mjs
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          
      - name: Commit and push fixes
        if: steps.fix.outputs.changes == 'true'
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "fix: auto-fix skeleton validation errors"
          git push

      - name: Trigger WebM export for fixed entries
        if: steps.fix.outputs.fixedIds != ''
        run: |
          echo "${{ steps.fix.outputs.fixedIds }}" | jq -r '.[]' | while read id; do
            gh api -X POST /repos/${{ github.repository }}/dispatches \
              -f event_type=spine-export-webm \
              -f client_payload="{\"uploadId\":\"$id\",\"animation\":\"fool_hv_1\",\"origin\":\"https://spine-link.vercel.app\",\"owner\":\"vladleopold\",\"repo\":\"spine\",\"branch\":\"main\"}"
          done
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  deploy-spine-link:
    needs: validate-and-fix
    if: always()
    runs-on: ubuntu-latest
    steps:
      - name: Trigger spine-link redeploy
        run: |
          # Trigger spine-link Vercel redeploy via API or push empty commit
          git clone https://github.com/vladleopold/spine-link.git
          cd spine-link
          git commit --allow-empty -m "trigger redeploy after skeleton fix"
          git push

