name: Synthetic WebM render gate

on:
  pull_request:
    paths:
      - 'scripts/prepare-render.mjs'
      - 'scripts/test-synthetic-render-skip.mjs'
      - 'scripts/lib/spine-export-matrix.mjs'
      - 'scripts/lib/export-log-redaction.mjs'
      - 'scripts/spine-export-matrix.mjs'
      - 'scripts/resolve-export-animation.mjs'
      - 'scripts/test-spine-export-matrix.mjs'
      - 'scripts/preview-animation-choice.mjs'
      - 'scripts/test-preview-animation-choice.mjs'
      - 'scripts/spine-export-webm.mjs'
      - 'scripts/atlas-pages.mjs'
      - 'scripts/test-atlas-pages.mjs'
      - 'scripts/preview-skin-choice.mjs'
      - 'scripts/test-preview-visibility-recovery.mjs'
      - 'scripts/lib/preview-visibility-recovery.mjs'
      - 'scripts/lib/spine-player-runtime-assets.mjs'
      - 'scripts/test-render-selection.mjs'
      - 'scripts/lib/spine-player-source-support.mjs'
      - 'scripts/repair-last-ten-previews.mjs'
      - 'scripts/test-repair-last-ten-previews.mjs'
      - 'scripts/test-repair-latest-twenty.mjs'
      - 'scripts/test-preview-log-privacy.mjs'
      - 'scripts/source-skeleton-choice.mjs'
      - 'scripts/source-skeleton-choice.mjs'
      - 'scripts/verify-latest-twenty-live.mjs'
      - 'scripts/repair-manifest-guard.mjs'
      - '.github/workflows/spine-export-full.yml'
      - '.github/workflows/spine-export-webm.yml'
      - '.github/workflows/synthetic-webm-render-gate.yml'
  push:
    branches: [main]
    paths:
      - 'scripts/prepare-render.mjs'
      - 'scripts/test-synthetic-render-skip.mjs'
      - 'scripts/lib/spine-export-matrix.mjs'
      - 'scripts/lib/export-log-redaction.mjs'
      - 'scripts/spine-export-matrix.mjs'
      - 'scripts/resolve-export-animation.mjs'
      - 'scripts/test-spine-export-matrix.mjs'
      - 'scripts/preview-animation-choice.mjs'
      - 'scripts/test-preview-animation-choice.mjs'
      - 'scripts/spine-export-webm.mjs'
      - 'scripts/atlas-pages.mjs'
      - 'scripts/test-atlas-pages.mjs'
      - 'scripts/preview-skin-choice.mjs'
      - 'scripts/test-preview-visibility-recovery.mjs'
      - 'scripts/lib/preview-visibility-recovery.mjs'
      - 'scripts/lib/spine-player-runtime-assets.mjs'
      - 'scripts/test-render-selection.mjs'
      - 'scripts/lib/spine-player-source-support.mjs'
      - 'scripts/repair-last-ten-previews.mjs'
      - 'scripts/test-repair-last-ten-previews.mjs'
      - 'scripts/test-repair-latest-twenty.mjs'
      - 'scripts/test-preview-log-privacy.mjs'
      - '.github/workflows/spine-export-full.yml'
      - '.github/workflows/spine-export-webm.yml'
      - '.github/workflows/synthetic-webm-render-gate.yml'

permissions:
  contents: read

jobs:
  synthetic-render-gate:
    runs-on: ubuntu-24.04
    timeout-minutes: 3
    steps:
      - uses: actions/checkout@v4
        with:
          sparse-checkout-cone-mode: false
          sparse-checkout: |
            /scripts/
            /scripts/source-skeleton-choice.mjs
            /library/index.json
            /library_*/index.json
            /.github/workflows/repair-last-ten-previews.yml
            /.github/workflows/repair-latest-twenty-previews.yml
            /.github/workflows/repair-reported-previews.yml
            /.github/workflows/spine-export-full.yml
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Verify syntax and synthetic-only exclusion
        run: |
          node --check scripts/prepare-render.mjs
          node --check scripts/test-synthetic-render-skip.mjs
          node --check scripts/lib/spine-export-matrix.mjs
          node --check scripts/lib/export-log-redaction.mjs
          node --check scripts/spine-export-matrix.mjs
          node --check scripts/resolve-export-animation.mjs
          node --check scripts/repair-reported-previews.mjs
          node --check scripts/repair-latest-twenty-previews.mjs
          node --check scripts/source-skeleton-choice.mjs
          node --check scripts/lib/spine-player-source-support.mjs
          node --check scripts/repair-last-ten-previews.mjs
          node --check scripts/preview-animation-choice.mjs
          node --check scripts/verify-reported-preview-live.mjs
          node --check scripts/mask-preview-manifest.mjs
          node --check scripts/lib/preview-manifest-redaction.mjs
          node scripts/test-synthetic-render-skip.mjs
          node scripts/test-spine-export-matrix.mjs
          node scripts/test-preview-log-privacy.mjs
          node scripts/test-preview-animation-choice.mjs
          node scripts/test-preview-visibility-recovery.mjs
          node --check scripts/spine-export-webm.mjs
          node scripts/test-atlas-pages.mjs
          node scripts/test-render-selection.mjs
          node scripts/test-repair-last-ten-previews.mjs
          node scripts/test-repair-latest-twenty.mjs
