name: Synthetic WebM render gate

on:
  pull_request:
    paths:
      - 'scripts/prepare-render.mjs'
      - 'scripts/test-synthetic-render-skip.mjs'
      - 'scripts/lib/spine-export-matrix.mjs'
      - 'scripts/spine-export-matrix.mjs'
      - 'scripts/resolve-export-animation.mjs'
      - 'scripts/test-spine-export-matrix.mjs'
      - '.github/workflows/spine-export-full.yml'
      - '.github/workflows/spine-export-webm.yml'
      - '.github/workflows/synthetic-webm-render-gate.yml'
  push:
    branches: [main]
    paths:
      - 'scripts/prepare-render.mjs'
      - 'scripts/test-synthetic-render-skip.mjs'
      - 'scripts/lib/spine-export-matrix.mjs'
      - 'scripts/spine-export-matrix.mjs'
      - 'scripts/resolve-export-animation.mjs'
      - 'scripts/test-spine-export-matrix.mjs'
      - '.github/workflows/spine-export-full.yml'
      - '.github/workflows/spine-export-webm.yml'
      - '.github/workflows/synthetic-webm-render-gate.yml'

permissions:
  contents: read

jobs:
  synthetic-render-gate:
    runs-on: ubuntu-24.04
    timeout-minutes: 3
    steps:
      - uses: actions/checkout@v4
        with:
          sparse-checkout-cone-mode: false
          sparse-checkout: |
            /scripts/prepare-render.mjs
            /scripts/resolve-library.mjs
            /scripts/test-synthetic-render-skip.mjs
            /scripts/lib/spine-export-matrix.mjs
            /scripts/spine-export-matrix.mjs
            /scripts/resolve-export-animation.mjs
            /scripts/test-spine-export-matrix.mjs
            /scripts/resolve-library.mjs
            /library/index.json
            /library_*/index.json
            /.github/workflows/spine-export-full.yml
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Verify syntax and synthetic-only exclusion
        run: |
          node --check scripts/prepare-render.mjs
          node --check scripts/test-synthetic-render-skip.mjs
          node --check scripts/lib/spine-export-matrix.mjs
          node --check scripts/spine-export-matrix.mjs
          node --check scripts/resolve-export-animation.mjs
          node scripts/test-synthetic-render-skip.mjs
          node scripts/test-spine-export-matrix.mjs
