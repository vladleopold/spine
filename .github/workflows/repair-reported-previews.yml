# Run version-matched Spine players for 18 reported source projects plus the priority work.
name: Repair and accept 18 reported plus priority Spine previews
on:
  push:
    branches: [main]
    paths:
      - .github/workflows/repair-reported-previews.yml
      - scripts/recover-recorded-webm.mjs
      - scripts/lib/recovered-animation-choice.mjs
      - scripts/test-recovered-animation-choice.mjs
      - scripts/repair-reported-previews.mjs
      - scripts/verify-existing-preview-media.mjs
      - scripts/lib/preview-media-validation.mjs
      - scripts/test-reported-preview-media-verification.mjs
      - scripts/spine-export-webm.mjs
      - scripts/lib/source-set-choice.mjs
      - scripts/test-source-set-choice.mjs
  workflow_dispatch:
  pull_request:
    paths:
      - .github/workflows/repair-reported-previews.yml
      - scripts/repair-reported-previews.mjs
      - scripts/verify-reported-preview-live.mjs
      - scripts/mask-preview-manifest.mjs
      - scripts/lib/preview-manifest-redaction.mjs
      - scripts/test-preview-log-privacy.mjs
      - scripts/preview-animation-choice.mjs
      - scripts/test-preview-animation-choice.mjs
      - scripts/test-no-preview-track-or-skin-fallbacks.mjs
      - scripts/spine-export-webm.mjs
      - scripts/lib/source-set-choice.mjs
      - scripts/test-source-set-choice.mjs
      - scripts/lib/preview-set-selection.mjs
      - api/github-upload.js
      - scripts/lib/spine-export-entry.mjs
      - scripts/render-work.mjs
      - scripts/test-upload-default-animation.mjs
      - scripts/recover-recorded-webm.mjs
      - scripts/lib/recovered-animation-choice.mjs
      - scripts/test-recovered-animation-choice.mjs
      - scripts/batch-export-all.mjs
      - api/github-preview.js
      - lib/spine-data-science.js
      - src/SpineApp.tsx
      - scripts/lib/reported-preview-live-status.mjs
      - scripts/test-reported-preview-live-status.mjs
      - .github/workflows/verify-reported-preview-live.yml
      - scripts/test-reported-preview-live-workflow.mjs
      - scripts/verify-existing-preview-media.mjs
      - scripts/lib/preview-media-validation.mjs
      - scripts/test-reported-preview-media-verification.mjs
      - scripts/lib/reported-preview-media.mjs
      - scripts/test-reported-preview-live.mjs
      - scripts/verify-preview-motion.mjs
      - scripts/verify-poster-first-frame.mjs
      - scripts/lib/first-frame-poster.mjs
permissions:
  contents: read
# Supersede the obsolete 4.0/4.1 render attempt after fixing binaryUrl/jsonUrl.
concurrency:
  group: spine-preview-reported-eighteen
  # A source fix must not discard already-rendered artifacts mid-batch.
  # Publish verified results first, then run the newer version.
  cancel-in-progress: false
jobs:
  inventory:
    permissions:
      contents: read
    runs-on: ubuntu-24.04
    outputs:
      matrix: ${{ steps.latest.outputs.matrix }}
      renderCount: ${{ steps.latest.outputs.renderCount }}
      sparseCheckout: ${{ steps.latest.outputs.sparseCheckout }}
    steps:
      - uses: actions/checkout@v4
        with:
          sparse-checkout-cone-mode: false
          sparse-checkout: |
            /.github/workflows/repair-reported-previews.yml
            /.github/workflows/verify-reported-preview-live.yml
            /scripts/
            /api/github-preview.js
            /api/github-upload.js
            /lib/spine-data-science.js
            /src/SpineApp.tsx
            /library/index.json
            /library_*/index.json
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Enumerate user-reported uploads and validate original Spine source triads
        id: latest
        env:
          SPINE_REPAIR_INDEX_ONLY: '1'
        shell: bash
        run: |
          node scripts/repair-reported-previews.mjs matrix >> "$GITHUB_OUTPUT"
          node --check scripts/repair-reported-previews.mjs
          node --check scripts/spine-export-webm.mjs
          node --check scripts/recover-recorded-webm.mjs
          node --check api/github-upload.js
          node --check scripts/render-work.mjs
          node --check scripts/preview-runtime-minor.mjs
          node scripts/test-canvas-fallback.mjs
          node scripts/test-atlas-pages.mjs
          node scripts/test-preview-animation-choice.mjs
          node scripts/test-no-preview-track-or-skin-fallbacks.mjs
          node --check scripts/lib/source-set-choice.mjs
          node scripts/test-source-set-choice.mjs
          node scripts/test-upload-default-animation.mjs
          node scripts/test-recovered-animation-choice.mjs
          node --check scripts/verify-reported-preview-live.mjs
          node --check scripts/verify-existing-preview-media.mjs
          node --check scripts/lib/preview-media-validation.mjs
          node scripts/test-reported-preview-live-status.mjs
          node scripts/test-reported-preview-live.mjs
          node scripts/test-reported-preview-live-workflow.mjs
          node scripts/test-reported-preview-media-verification.mjs
          echo "REPORTED_PREVIEWS_INVENTORY_VALID"
  app-build:
    name: Build app and validate preview API
    if: github.event_name == 'pull_request'
    permissions:
      contents: read
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - name: Validate changed server modules and build the React application
        run: |
          set -euo pipefail
          node --check api/github-preview.js
          node --check scripts/verify-existing-preview-media.mjs
          node --check scripts/lib/preview-media-validation.mjs
          node --check lib/spine-data-science.js
          node --check scripts/batch-export-all.mjs
          npm ci --ignore-scripts --no-audit --no-fund
          npm run build

  render:
    name: validate-reported-preview-${{ matrix.entry.repairSlot }}
    needs: inventory
    if: github.ref == 'refs/heads/main' || github.event_name == 'pull_request'
    runs-on: ubuntu-24.04
    timeout-minutes: 35
    env:
      ENTRY_READY: ${{ matrix.entry.ready }}
      REPAIR_SLOT: ${{ matrix.entry.repairSlot }}
    strategy:
      fail-fast: false
      max-parallel: 4
      matrix:
        entry: ${{ fromJson(needs.inventory.outputs.matrix) }}
    steps:
      - uses: actions/checkout@v4
        with:
          sparse-checkout-cone-mode: false
          sparse-checkout: |
            /scripts/
            /package.json
            /package-lock.json
            /public/vendor-spine-player-3.7.js
            /public/vendor-spine-player-3.7.css
            /public/vendor-spine-player-3.8.js
            /public/vendor-spine-player-3.8.css
            /library/index.json
            /library_*/index.json
      - name: Mask private metadata and hydrate exact source
        if: matrix.entry.ready
        shell: bash
        run: |
          set -euo pipefail
          node scripts/repair-reported-previews.mjs prepare "$REPAIR_SLOT"
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Install FFmpeg for existing-media verification
        if: matrix.entry.ready
        shell: bash
        run: |
          set -euo pipefail
          if ! command -v ffmpeg >/dev/null 2>&1 || ! command -v ffprobe >/dev/null 2>&1; then
            sudo apt-get update -qq
            sudo apt-get install -y -qq ffmpeg
          fi
      - name: Validate existing selected animation media before render
        id: existing
        if: matrix.entry.ready
        shell: bash
        run: |
          set +e
          node scripts/verify-existing-preview-media.mjs \
            --upload-id="$ENTRY_ID" --base-path="$ENTRY_BASE_PATH" \
            --animation="$ENTRY_ANIMATION" --repo-path="$GITHUB_WORKSPACE" \
            --slot="$REPAIR_SLOT" --preview-path="$PREVIEW_PATH" \
            --output="out/$REPAIR_SLOT/meta.json" \
            > "$RUNNER_TEMP/existing-media.log" 2>&1
          code=$?
          set -e
          cat "$RUNNER_TEMP/existing-media.log"
          if (( code == 0 )); then
            echo "verified=true" >> "$GITHUB_OUTPUT"
          else
            echo "verified=false" >> "$GITHUB_OUTPUT"
            if [[ "$GITHUB_EVENT_NAME" == "pull_request" ]]; then
              echo "EXISTING_MEDIA_INVALID_RENDERING_EXACT_SELECTED_ANIMATION"
            fi
          fi
      - name: Install native Chromium renderer and video/poster encoders
        if: (github.ref == 'refs/heads/main' || github.event_name == 'pull_request') && matrix.entry.ready && steps.existing.outputs.verified != 'true'
        shell: bash
        run: |
          set -euo pipefail
          npm install --no-save --no-audit --no-fund playwright@1.59.1
          # Pin the Web Player to the skeleton's own major.minor and serve it
          # from local Playwright routes. CDN redirects are never on the render
          # critical path; 4.0.29 also avoids the known 4.0.28 mismatch.
          minor=$(node scripts/preview-runtime-minor.mjs "$GITHUB_WORKSPACE/$PREVIEW_PATH")
          if [[ "$minor" =~ ^4\.[012]$ ]]; then
            version="$minor"
            if [[ "$minor" == '4.0' ]]; then version='4.0.29'; fi
            mkdir -p "$RUNNER_TEMP/spine-versioned"
            npm install --no-save --no-audit --no-fund --prefix "$RUNNER_TEMP/spine-versioned" "@esotericsoftware/spine-player@$version"
            test -s "$RUNNER_TEMP/spine-versioned/node_modules/@esotericsoftware/spine-player/dist/iife/spine-player.js"
            echo "SPINE_VERSIONED_PLAYER_DIR=$RUNNER_TEMP/spine-versioned" >> "$GITHUB_ENV"
            echo "MATCHED_SPINE_RUNTIME_READY $minor"
          fi
          if command -v google-chrome >/dev/null 2>&1; then
            echo "PLAYWRIGHT_EXECUTABLE=$(command -v google-chrome)" >> "$GITHUB_ENV"
            echo "Using preinstalled Chrome for WebGL preview rendering"
          else
            npx playwright install chromium
          fi
          if ! command -v ffmpeg >/dev/null 2>&1 || ! command -v ffprobe >/dev/null 2>&1; then
            sudo apt-get update -qq
            sudo apt-get install -y -qq ffmpeg
          fi
      - name: Fingerprint source bundle before exact-animation render
        id: source_before
        if: (github.ref == 'refs/heads/main' || github.event_name == 'pull_request') && matrix.entry.ready && steps.existing.outputs.verified != 'true'
        shell: bash
        run: |
          set -euo pipefail
          test -d "$PREVIEW_PATH"
          find "$PREVIEW_PATH" -type f -print0 | LC_ALL=C sort -z | xargs -0 -r sha256sum > "$RUNNER_TEMP/source.before"
          test -s "$RUNNER_TEMP/source.before"
      - name: Render and validate actual Spine video + still posters
        if: (github.ref == 'refs/heads/main' || github.event_name == 'pull_request') && matrix.entry.ready && steps.existing.outputs.verified != 'true'
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p "out/$REPAIR_SLOT"
          if [[ "$ENTRY_READY" != true ]]; then
            echo '{"ok":false,"reason":"incomplete-source"}' > "out/$REPAIR_SLOT/meta.json"
            echo "ACCEPTANCE_BLOCKED_INCOMPLETE_SOURCE"
            exit 0
          fi
          set +e
          node scripts/spine-export-webm.mjs \
            --upload-id="$ENTRY_ID" --animation="$ENTRY_ANIMATION" \
            --repo-path="$GITHUB_WORKSPACE" \
            --output="$RUNNER_TEMP/slot-$REPAIR_SLOT-preview.webm" > "$RUNNER_TEMP/renderer.log" 2>&1
          code=$?
          set -e
          if (( code != 0 )) && [[ -s "$RUNNER_TEMP/slot-$REPAIR_SLOT-preview.webm" ]]; then
            # A genuine recorded WebM may survive even when its secondary
            # quality ladder/poster encoder fails. Verify real changing frames
            # and rebuild the missing output files instead of dropping it.
            if node scripts/recover-recorded-webm.mjs \
              "$RUNNER_TEMP/slot-$REPAIR_SLOT-preview.webm" "$ENTRY_ANIMATION" "$ENTRY_ID" \
              > "$RUNNER_TEMP/recovery.log" 2>&1; then
              echo "REAL_RECORDED_SPINE_WEBM_SALVAGED"
              code=0
            else
              echo "RECORDED_WEBM_RECOVERY_REJECTED"
            fi
          fi
          if (( code != 0 )); then
            node scripts/renderer-failure-class.mjs "$RUNNER_TEMP/renderer.log" > "$RUNNER_TEMP/renderer-summary.log"
            cat "$RUNNER_TEMP/renderer-summary.log"
            disposition=$(node --input-type=module - "$RUNNER_TEMP/renderer-summary.log" <<'NODE'
          import fs from "node:fs";
          import { previewRenderDisposition } from "./scripts/lib/preview-media-validation.mjs";
          const raw=fs.readFileSync(process.argv[2],"utf8");
          const match=raw.match(/SANITIZED_RENDER_RESULT=(\{[^\r\n]+\})/);
          if(!match)throw new Error("Missing sanitized renderer summary");
          process.stdout.write(previewRenderDisposition(JSON.parse(match[1])));
          NODE
            )
            if [[ "$disposition" == "blocked" ]]; then
              node --input-type=module - "$RUNNER_TEMP/renderer-summary.log" "out/$REPAIR_SLOT/meta.json" <<'NODE'
          import fs from "node:fs";
          const raw=fs.readFileSync(process.argv[2],"utf8");
          const match=raw.match(/SANITIZED_RENDER_RESULT=(\{[^\r\n]+\})/);
          if(!match)throw new Error("Missing sanitized renderer summary");
          const summary=JSON.parse(match[1]);
          const failureCode=String(summary.distinctError||"").replace(/[^A-Z0-9_]/g,"");
          if(!failureCode)throw new Error("Missing safe renderer failure code");
          fs.writeFileSync(process.argv[3],JSON.stringify({ok:false,reason:"blocked",failureCode}));
          NODE
              echo "ACCEPTANCE_BLOCKED_EXACT_SELECTED_ANIMATION"
              exit 0
            fi
            echo '{"ok":false,"reason":"render-failed"}' > "out/$REPAIR_SLOT/meta.json"
            if [[ "$GITHUB_EVENT_NAME" == "pull_request" ]]; then
              echo "::error::Unexpected exact-animation renderer failure; no alternate animation will be used"
              exit 1
            fi
            echo "::warning::Native Spine rendering failed; no preview will be published"
            exit 0
          fi
          for suffix in '' '-medium' '-low'; do
            for ext in webm webp; do
              in="$RUNNER_TEMP/slot-$REPAIR_SLOT-preview$suffix.$ext"
              test -s "$in" || { echo "::error::Missing output $ext"; exit 1; }
              cp "$in" "out/$REPAIR_SLOT/preview$suffix.$ext"
            done
            ffprobe -v error -select_streams v:0 -show_entries stream=codec_name,width,height \
              -of default=nw=1 "out/$REPAIR_SLOT/preview$suffix.webm" | grep -q '^codec_name='
            video_duration=$(ffprobe -v error -show_entries format=duration \
              -of default=nw=1:nk=1 "out/$REPAIR_SLOT/preview$suffix.webm")
            awk -v seconds="$video_duration" 'BEGIN { exit !(seconds >= 0.5) }' || {
              echo "::error::Rejected nonplayable short preview video"
              exit 1
            }
            file "out/$REPAIR_SLOT/preview$suffix.webp" | grep -q 'Web/P image'
            node scripts/verify-preview-motion.mjs "out/$REPAIR_SLOT/preview$suffix.webm" >/dev/null
            node scripts/verify-poster-first-frame.mjs "out/$REPAIR_SLOT/preview$suffix.webm" "out/$REPAIR_SLOT/preview$suffix.webp" >/dev/null
          done
          cp "$RUNNER_TEMP/slot-$REPAIR_SLOT-preview.webm.json" "out/$REPAIR_SLOT/meta.json"
          node --input-type=module -e '
            import fs from "node:fs";
            import {createHash} from "node:crypto";
            const p=process.argv[1],m=JSON.parse(fs.readFileSync(p,"utf8"));
            if(!m.sha256||!m.bytes||!m.animation||m.animation!==process.env.ENTRY_ANIMATION||!m.width||!m.height)
              throw new Error("Export metadata incomplete or animation identity mismatch");
            m.animationHash=createHash("sha256").update(m.animation).digest("hex");
            delete m.animation;
            m.animationMatches=true;
            m.ok=true;
            fs.writeFileSync(p,JSON.stringify(m));
            console.log("ACCEPTANCE_PASS_WEBM_WEBP_3_QUALITIES");
          ' "out/$REPAIR_SLOT/meta.json"
      - name: Verify source bundle remained byte-identical
        if: always() && (github.ref == 'refs/heads/main' || github.event_name == 'pull_request') && matrix.entry.ready && steps.existing.outputs.verified != 'true' && steps.source_before.outcome == 'success'
        shell: bash
        run: |
          set -euo pipefail
          find "$PREVIEW_PATH" -type f -print0 | LC_ALL=C sort -z | xargs -0 -r sha256sum > "$RUNNER_TEMP/source.after"
          if ! cmp -s "$RUNNER_TEMP/source.before" "$RUNNER_TEMP/source.after"; then
            echo "::error::SOURCE_PRESERVATION_FAILED"
            exit 1
          fi
          echo "SOURCE_PRESERVATION_PASS"
      - uses: actions/upload-artifact@v4
        if: github.ref == 'refs/heads/main' && matrix.entry.ready
        with:
          name: reported19-${{ matrix.entry.repairSlot }}
          path: out/${{ matrix.entry.repairSlot }}/
          if-no-files-found: error
          retention-days: 1
  publish:
    needs: [inventory, render]
    permissions:
      contents: write
    if: always() && github.ref == 'refs/heads/main' && needs.inventory.result == 'success' && needs.render.result == 'success'
    runs-on: ubuntu-24.04
    timeout-minutes: 12
    concurrency:
      group: spine-library-commit
      cancel-in-progress: false
    steps:
      - uses: actions/checkout@v4
        with:
          sparse-checkout-cone-mode: false
          sparse-checkout: ${{ needs.inventory.outputs.sparseCheckout }}
      - name: Mask and hydrate exact reported source directories
        shell: bash
        run: |
          set -euo pipefail
          node scripts/repair-reported-previews.mjs prepare-all
      - uses: actions/download-artifact@v4
        if: needs.inventory.outputs.renderCount != '0'
        with:
          pattern: reported19-*
          path: downloaded-reported19
          merge-multiple: false
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Install FFmpeg for final media acceptance
        shell: bash
        run: |
          set -euo pipefail
          if ! command -v ffmpeg >/dev/null 2>&1 || ! command -v ffprobe >/dev/null 2>&1; then
            sudo apt-get update -qq
            sudo apt-get install -y -qq ffmpeg
          fi
      - name: Publish verified only, retain source untouched, flag missing and failed
        shell: bash
        run: |
          set -euo pipefail
          git config user.name github-actions[bot]
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          for attempt in 1 2 3 4; do
            git fetch --no-tags origin +refs/heads/main:refs/remotes/origin/main
            git reset --hard refs/remotes/origin/main
            node scripts/repair-reported-previews.mjs merge
            # Stage ONLY outputs inside library collections; CI artifacts and
            # temporary source files must never enter the repository.
            git add -A -- library_*
            if git diff --cached --quiet; then
              echo "NO_REPORTED_PREVIEW_CHANGES"
              node -e 'const s=require("./preview-repair-summary.json");console.log("RENDER_BATCH_STATUS="+JSON.stringify(s));if(s.failed||s.blocked)console.warn("Some originals remain blocked; independently accepted media are retained")'
              exit 0
            fi
            git commit -m 'fix: publish independently validated previews for reported Spine projects'
            if git push origin HEAD:main; then
              echo "REPORTED_PREVIEWS_PUBLISHED"
              node -e 'const s=require("./preview-repair-summary.json");console.log("RENDER_BATCH_STATUS="+JSON.stringify(s));if(s.failed||s.blocked)console.warn("Some originals remain blocked; independently accepted media were published")'
              exit 0
            fi
            sleep $(( attempt * 3 ))
          done
          echo "::error::Could not atomically publish independently accepted Spine previews"
          exit 1

  verify-production:
    needs: [inventory, render, publish]
    if: github.ref == 'refs/heads/main' && needs.publish.result == 'success'
    runs-on: ubuntu-24.04
    timeout-minutes: 18
    steps:
      - uses: actions/checkout@v4
        with:
          sparse-checkout-cone-mode: false
          sparse-checkout: |
            /.github/workflows/repair-reported-previews.yml
            /.github/workflows/verify-reported-preview-live.yml
            /scripts/verify-reported-preview-live.mjs
            /scripts/lib/reported-preview-live-status.mjs
            /scripts/lib/reported-preview-media.mjs
            /scripts/lib/first-frame-poster.mjs
            /scripts/verify-preview-motion.mjs
            /scripts/verify-poster-first-frame.mjs
            /scripts/test-reported-preview-live.mjs
            /scripts/test-reported-preview-live-workflow.mjs
            /scripts/resolve-library.mjs
            /library_02/index.json
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Install FFmpeg for actual media decoding
        shell: bash
        run: |
          set -euo pipefail
          if ! command -v ffmpeg >/dev/null 2>&1 || ! command -v ffprobe >/dev/null 2>&1; then
            sudo apt-get update -qq
            sudo apt-get install -y -qq --no-install-recommends ffmpeg
          fi
          ffmpeg -version | head -n 1
          ffprobe -version | head -n 1
      - name: Verify sparse checkout and media acceptance contracts
        run: |
          node --check scripts/verify-reported-preview-live.mjs
          node scripts/test-reported-preview-live.mjs
          node scripts/test-reported-preview-live-workflow.mjs
      - name: Verify actual media responses after publication
        run: node scripts/verify-reported-preview-live.mjs
