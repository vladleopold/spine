name: Private legacy boss 3.x runtime compatibility gate
on:
  push:
    branches: [fix/atlas-inference-boss-20261118]
    paths: [scripts/test-boss-runtime-private.mjs, .github/workflows/test-boss-runtime-private.yml]
  workflow_dispatch:
permissions:
  contents: read
jobs:
  render:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          sparse-checkout: |
            scripts/test-boss-runtime-private.mjs
            lib/atlas-inference.js
            library_02/boss_1-2026-11-14T20-07-17-943Z
            public/vendor-spine-player-3.7.js
            public/vendor-spine-player-3.8.js
            package.json
          sparse-checkout-cone-mode: false
      - uses: actions/setup-node@v4
        with: {node-version: '22'}
      - name: Install only playwright and PNG decoder
        run: npm install --no-save --no-package-lock --ignore-scripts playwright@1.59.1 pngjs@7.0.0
      - name: Install Chromium
        run: npx playwright install --with-deps chromium
      - name: Check legacy JSON+atlas in both old runtimes
        run: node scripts/test-boss-runtime-private.mjs
