name: Verify live Spine media across the full archive
on:
  schedule:
    - cron: '47 * * * *'
  push:
    branches: [main]
    paths:
      - .github/workflows/verify-spine-production-media.yml
      - scripts/verify-ready-preview-live.mjs
      - scripts/lib/archive-live-media-audit.mjs
      - scripts/test-verify-ready-preview-live.mjs
      - scripts/verify-preview-motion.mjs
      - scripts/verify-poster-first-frame.mjs
      - scripts/lib/first-frame-poster.mjs
      - scripts/resolve-library.mjs
      - library/index.json
      - library_*/index.json
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: spine-full-archive-live-media-audit
  cancel-in-progress: false
jobs:
  check-live:
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
        with:
          sparse-checkout-cone-mode: false
          sparse-checkout: |
            /.github/workflows/verify-spine-production-media.yml
            /scripts/resolve-library.mjs
            /scripts/verify-ready-preview-live.mjs
            /scripts/lib/archive-live-media-audit.mjs
            /scripts/test-verify-ready-preview-live.mjs
            /scripts/verify-preview-motion.mjs
            /scripts/verify-poster-first-frame.mjs
            /scripts/lib/first-frame-poster.mjs
            /library/index.json
            /library_*/index.json
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Install FFmpeg for real WebM/WebP decoding
        shell: bash
        run: |
          set -euo pipefail
          if ! command -v ffmpeg >/dev/null 2>&1 || ! command -v ffprobe >/dev/null 2>&1; then
            sudo apt-get update -qq
            sudo apt-get install -y -qq --no-install-recommends ffmpeg
          fi
          ffmpeg -version | head -n 1
          ffprobe -version | head -n 1
      - name: Verify full-archive audit contract
        run: |
          node --check scripts/verify-ready-preview-live.mjs
          node --check scripts/lib/archive-live-media-audit.mjs
          node scripts/test-verify-ready-preview-live.mjs
      - name: Verify every ready public card on production
        run: node scripts/verify-ready-preview-live.mjs
