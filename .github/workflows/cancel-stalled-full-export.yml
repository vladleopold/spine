name: Release archive publish lock from unrelated full export
on:
  push:
    branches: [main]
    paths:
      - scripts/repair-latest-70-trigger.json
permissions:
  actions: write
jobs:
  cancel-unrelated-full-export:
    runs-on: ubuntu-24.04
    steps:
      - name: Cancel the stalled all-animation export that is blocking archive recovery
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          run_id=45421890152
          status=$(gh api "repos/${GITHUB_REPOSITORY}/actions/runs/${run_id}" --jq '.status')
          if [[ "$status" == "queued" || "$status" == "in_progress" ]]; then
            gh api --method POST "repos/${GITHUB_REPOSITORY}/actions/runs/${run_id}/cancel"
            echo "CANCELLED_UNRELATED_FULL_EXPORT=$run_id"
          else
            echo "FULL_EXPORT_ALREADY_FINISHED status=$status"
          fi
