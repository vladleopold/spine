name: Recover archive Spine WebP and WebM previews in 50-item batches
# PR-head regression checks explicitly test the source branch and include the synthetic gate file.
# Canonical automatic recovery pipeline. Targeted latest-10 and reported-project repair
# workflows remain manually/feature-branch invoked to prevent overlapping main-branch writes.
on:
  # Reconcile the newest 50 entries frequently so deleted or stale media is repaired.
  # Scheduled runs stop after offset 0; historical archive batches remain opt-in.
  schedule:
    - cron: '*/15 * * * *'
  # A single explicit marker starts the one-time newest-70 recovery.
  push:
    branches: [main]
    paths:
      - scripts/repair-latest-70-trigger.json
  pull_request:
    paths:
      - .github/workflows/repair-latest-twenty-previews.yml
      - scripts/repair-latest-twenty-previews.mjs
      - scripts/verify-latest-twenty-live.mjs
      - scripts/test-repair-latest-twenty.mjs
      - .github/workflows/spine-export-webm.yml
      - scripts/test-render-selection.mjs
      - scripts/lib/spine-player-source-support.mjs
      - scripts/verify-preview-motion.mjs
      - scripts/renderer-failure-class.mjs
      - scripts/test-renderer-failure-class.mjs
      - scripts/test-preview-motion.mjs
      - scripts/spine-export-webm.mjs
      - scripts/lib/spine-player-runtime-assets.mjs
      - scripts/lib/spine-json-runtime-compat.mjs
      - scripts/test-spine-player-runtime-assets.mjs
      - scripts/test-spine-json-runtime-compat.mjs
      - scripts/source-skeleton-choice.mjs
      - scripts/test-source-skeleton-choice.mjs
      - scripts/lib/first-frame-poster.mjs
      - scripts/test-first-frame-poster.mjs
      - scripts/test-first-frame-poster-real.mjs
      - scripts/verify-poster-first-frame.mjs
      - scripts/lib/spine-binary-json-alias.mjs
      - scripts/test-spine-binary-json-alias.mjs
      - scripts/lib/atlas-source-integrity.mjs
      - scripts/install-pinned-spine-players.sh
      - scripts/lib/preview-visibility-recovery.mjs
      - scripts/lib/preview-frame-content.mjs
      - scripts/atlas-pages.mjs
      - scripts/test-atlas-pages.mjs
      - scripts/test-preview-visibility-recovery.mjs
      - scripts/preview-animation-choice.mjs
      - scripts/test-preview-animation-choice.mjs
      - scripts/lib/fetch-public-index.mjs
      - scripts/test-public-index-fetch.mjs
      - scripts/lib/atlas-source-integrity.mjs
      - scripts/test-atlas-source-integrity.mjs
      - api/github-upload.js
      - scripts/lib/spine-export-entry.mjs
      - scripts/test-upload-default-animation.mjs
      - .github/workflows/spine-export-all.yml
      - .github/workflows/spine-export-full.yml
      - .github/workflows/repair-last-ten-previews.yml
      - .github/workflows/repair-reported-previews.yml
  workflow_dispatch:
    inputs:
      limit:
        description: 'Number of works in this archive batch (1–50)'
        required: true
        type: number
        default: 50
      offset:
        description: 'Zero-based offset into the public archive, newest first'
        required: true
        type: number
        default: 0
permissions:
  contents: read
concurrency:
  # One archive batch per branch. New main-branch runs supersede older batches.
  group: spine-preview-latest-twenty-${{ github.ref }}-${{ github.event_name }}
  cancel-in-progress: true
jobs:
  inventory:
    runs-on: ubuntu-24.04
    # Inventory now hydrates all source directories in the bounded batch.
    timeout-minutes: 20
    outputs:
      matrix: ${{ steps.latest.outputs.matrix }}
      renderCount: ${{ steps.latest.outputs.renderCount }}
      totalCount: ${{ steps.latest.outputs.totalCount }}
      nextOffset: ${{ steps.latest.outputs.nextOffset }}
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          sparse-checkout-cone-mode: false
          sparse-checkout: |
            /api/github-upload.js
            /.github/workflows/repair-last-ten-previews.yml
            /.github/workflows/repair-latest-twenty-previews.yml
            /.github/workflows/repair-reported-previews.yml
            /.github/workflows/synthetic-webm-render-gate.yml
            /.github/workflows/build-sa-reference-index.yml
            /.github/workflows/spine-export-webm.yml
            /.github/workflows/spine-export-all.yml
            /.github/workflows/spine-export-full.yml
            /scripts/
            /scripts/source-skeleton-choice.mjs
            /library/index.json
            /library_*/index.json
      - uses: actions/setup-node@v7
        with:
          node-version: '22'
      - name: Install pinned FFmpeg binaries for synthetic first-frame poster regression
        shell: bash
        run: |
          set -euo pipefail
          npm install --no-save --no-audit --no-fund --prefix "$RUNNER_TEMP/ffmpeg-native" \
            @ffprobe-installer/ffprobe @ffmpeg-installer/ffmpeg
          mkdir -p "$RUNNER_TEMP/ffmpeg-bin"
          FFPROBE_BINARY=$(node -p "require('$RUNNER_TEMP/ffmpeg-native/node_modules/@ffprobe-installer/ffprobe').path")
          FFMPEG_BINARY=$(node -p "require('$RUNNER_TEMP/ffmpeg-native/node_modules/@ffmpeg-installer/ffmpeg').path")
          test -x "$FFPROBE_BINARY" && test -x "$FFMPEG_BINARY"
          ln -sf "$FFPROBE_BINARY" "$RUNNER_TEMP/ffmpeg-bin/ffprobe"
          ln -sf "$FFMPEG_BINARY" "$RUNNER_TEMP/ffmpeg-bin/ffmpeg"
          echo "$RUNNER_TEMP/ffmpeg-bin" >> "$GITHUB_PATH"
          export PATH="$RUNNER_TEMP/ffmpeg-bin:$PATH"
          ffmpeg -version | head -n 1
          ffprobe -version | head -n 1
      - name: Enumerate requested newest uploads and validate required source file triads
        id: latest
        env:
          SPINE_REPAIR_LIMIT: ${{ github.event_name == 'pull_request' && '20' || inputs.limit || '50' }}
          SPINE_REPAIR_OFFSET: ${{ github.event_name == 'pull_request' && '0' || inputs.offset || '0' }}
          SPINE_REPAIR_SKIP_LIVE: ${{ github.event_name == 'pull_request' && '1' || '0' }}
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        shell: bash
        run: |
          node scripts/repair-latest-twenty-previews.mjs matrix >> "$GITHUB_OUTPUT"
          node --check api/github-upload.js
          node --check scripts/repair-latest-twenty-previews.mjs
          node --check scripts/verify-latest-twenty-live.mjs
          node --check scripts/verify-preview-motion.mjs
          node scripts/test-preview-motion.mjs
          node scripts/test-renderer-failure-class.mjs
          node scripts/test-render-selection.mjs
          SPINE_REPAIR_LIMIT=20 node scripts/test-repair-latest-twenty.mjs
          node scripts/test-upload-default-animation.mjs
          node scripts/test-first-frame-poster.mjs
          node --check scripts/verify-poster-first-frame.mjs
          node --check scripts/lib/first-frame-poster.mjs
          node scripts/test-preview-visibility-recovery.mjs
          node --check scripts/spine-export-webm.mjs
          node --check scripts/recover-recorded-webm.mjs
          node scripts/test-canvas-fallback.mjs
          node scripts/test-atlas-pages.mjs
          node scripts/test-atlas-source-integrity.mjs
          node scripts/test-spine-version-detect.mjs
          node scripts/test-spine-binary-json-alias.mjs
          node scripts/test-source-skeleton-choice.mjs
          node --check scripts/source-skeleton-choice.mjs
          node scripts/test-preview-animation-choice.mjs
          node scripts/test-spine-player-runtime-assets.mjs
          node scripts/test-spine-json-runtime-compat.mjs
          node scripts/test-public-index-fetch.mjs
          node scripts/test-repair-manifest-guard.mjs
          node scripts/test-preview-log-privacy.mjs
          echo "LATEST50_INVENTORY_VALID"
      - uses: actions/upload-artifact@v4
        with:
          name: latest50-manifest
          path: repair-manifest.json
          if-no-files-found: error
          retention-days: 1
  runtime-package-smoke:
    runs-on: ubuntu-24.04
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          sparse-checkout-cone-mode: false
          sparse-checkout: |
            /scripts/install-pinned-spine-players.sh
            /scripts/preview-skin-choice.mjs
            /scripts/preview-animation-choice.mjs
            /scripts/lib/preview-visibility-recovery.mjs
            /scripts/lib/preview-frame-content.mjs
            /scripts/lib/spine-json-runtime-compat.mjs
            /scripts/lib/canvas-fallback.mjs
            /scripts/spine-export-webm.mjs
            /scripts/test-preview-visibility-recovery.mjs
            /scripts/test-spine-json-runtime-compat.mjs
            /scripts/test-canvas-fallback.mjs
      - uses: actions/setup-node@v7
        with:
          node-version: '22'
      - name: Verify all four pinned Spine runtime bundles load from disk
        run: bash scripts/install-pinned-spine-players.sh "$RUNNER_TEMP/spine-player-runtimes"
      - name: Verify preview visibility, Spine 3.8 skin maps, and canvas fallback bounds
        run: |
          node scripts/test-preview-visibility-recovery.mjs
          node scripts/test-spine-json-runtime-compat.mjs
          node scripts/test-canvas-fallback.mjs
      - uses: actions/upload-artifact@v4
        with:
          name: spine-player-runtimes
          path: ${{ runner.temp }}/spine-player-runtimes/
          if-no-files-found: error
          retention-days: 1
  cancel-hosted-batches:
    if: github.ref == 'refs/heads/main' && github.event_name != 'pull_request'
    runs-on: ubuntu-24.04
    permissions:
      actions: write
    steps:
      - name: Cancel older archive render batches before private rendering
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          gh api "repos/${GITHUB_REPOSITORY}/actions/runs?per_page=100" |
            jq -r --arg current_run "$GITHUB_RUN_ID" '.workflow_runs[] |
              select((.id | tostring) != $current_run) |
              select(.path == ".github/workflows/repair-latest-twenty-previews.yml") |
              select(.head_branch == "main") |
              select(.status == "queued" or .status == "in_progress") | .id' |
          while IFS= read -r run_id; do
            [ -n "$run_id" ] || continue
            gh api --method POST "repos/${GITHUB_REPOSITORY}/actions/runs/${run_id}/cancel"
            echo "CANCELLED_LEGACY_RENDER_BATCH=$run_id"
          done

  render:
    name: validate-latest50-${{ matrix.entry.repairSlot }}
    needs: [inventory, runtime-package-smoke, cancel-hosted-batches]
    if: github.ref == 'refs/heads/main'
    # Real source rendering runs only on the dedicated public GitHub-hosted Ubuntu runner.
    runs-on: ubuntu-24.04
    timeout-minutes: 35
    strategy:
      fail-fast: false
      max-parallel: 4
      matrix:
        entry: ${{ fromJson(needs.inventory.outputs.matrix) }}
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          sparse-checkout-cone-mode: false
          sparse-checkout: |
            /scripts/
            /package.json
            /package-lock.json
            /public/vendor-spine-player-3.7.js
            /public/vendor-spine-player-3.7.css
            /public/vendor-spine-player-3.8.js
            /public/vendor-spine-player-3.8.css
            /library/index.json
            /library_*/index.json
      - name: Mask private source metadata and hydrate exact source
        env:
          ENTRY_ID: ${{ matrix.entry.id }}
          ENTRY_BASE_PATH: ${{ matrix.entry.basePath }}
          PREVIEW_PATH: ${{ matrix.entry.previewPath }}
          ENTRY_ANIMATION: ${{ matrix.entry.animation }}
          ALLOW_VISIBLE_TRACK_FALLBACK: "true"
          ENTRY_READY: ${{ matrix.entry.ready }}
          ENTRY_NEEDS_RENDER: ${{ matrix.entry.needsRender }}
          REPAIR_SLOT: ${{ matrix.entry.repairSlot }}
        shell: bash
        run: |
          set -euo pipefail
          node scripts/mask-preview-manifest.mjs
          git sparse-checkout add "$PREVIEW_PATH/" >/dev/null
      - uses: actions/setup-node@v7
        with:
          node-version: '22'
      - uses: actions/download-artifact@v4
        with:
          name: spine-player-runtimes
          path: ${{ runner.temp }}/spine-player-runtimes
      - name: Configure shared pinned Spine runtimes
        if: matrix.entry.needsRender
        shell: bash
        run: |
          set -euo pipefail
          test -s "$RUNNER_TEMP/spine-player-runtimes/spine-4.0/node_modules/@esotericsoftware/spine-player/dist/iife/spine-player.js"
          test -s "$RUNNER_TEMP/spine-player-runtimes/spine-4.1/node_modules/@esotericsoftware/spine-player/dist/iife/spine-player.js"
          test -s "$RUNNER_TEMP/spine-player-runtimes/spine-4.2/node_modules/@esotericsoftware/spine-player/dist/iife/spine-player.js"
          test -s "$RUNNER_TEMP/spine-player-runtimes/spine-4.3/node_modules/@esotericsoftware/spine-player/dist/iife/spine-player.js"
          echo "SPINE_VERSIONED_PLAYER_DIR=$RUNNER_TEMP/spine-player-runtimes" >> "$GITHUB_ENV"
      - name: Install native Chromium renderer and video/poster encoders
        if: matrix.entry.needsRender
        shell: bash
        run: |
          set -euo pipefail
          npm install --no-save --no-audit --no-fund playwright@1.59.1
          if command -v google-chrome >/dev/null 2>&1; then
            echo "PLAYWRIGHT_EXECUTABLE=$(command -v google-chrome)" >> "$GITHUB_ENV"
            echo "Using preinstalled Chrome for WebGL preview rendering"
          else
            npx playwright install chromium
          fi
          npm install --no-save --no-audit --no-fund --prefix "$RUNNER_TEMP/ffmpeg-native" \
            @ffprobe-installer/ffprobe @ffmpeg-installer/ffmpeg
          mkdir -p "$RUNNER_TEMP/ffmpeg-bin"
          FFPROBE_BINARY=$(node -p "require('$RUNNER_TEMP/ffmpeg-native/node_modules/@ffprobe-installer/ffprobe').path")
          FFMPEG_BINARY=$(node -p "require('$RUNNER_TEMP/ffmpeg-native/node_modules/@ffmpeg-installer/ffmpeg').path")
          test -x "$FFPROBE_BINARY" && test -x "$FFMPEG_BINARY"
          ln -sf "$FFPROBE_BINARY" "$RUNNER_TEMP/ffmpeg-bin/ffprobe"
          ln -sf "$FFMPEG_BINARY" "$RUNNER_TEMP/ffmpeg-bin/ffmpeg"
          echo "$RUNNER_TEMP/ffmpeg-bin" >> "$GITHUB_PATH"
          export PATH="$RUNNER_TEMP/ffmpeg-bin:$PATH"
          ffmpeg -version | head -n 1
          ffprobe -version | head -n 1
      - name: Render and validate actual Spine video + still posters
        if: matrix.entry.needsRender
        env:
          ALLOW_VISIBLE_TRACK_FALLBACK: "true"
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p "out/$REPAIR_SLOT"
          if [[ "$ENTRY_READY" != true ]]; then
            echo '{"ok":false,"reason":"incomplete-source"}' > "out/$REPAIR_SLOT/meta.json"
            echo "ACCEPTANCE_BLOCKED_INCOMPLETE_SOURCE"
            exit 0
          fi
          if [[ "$ENTRY_NEEDS_RENDER" != true ]]; then
            echo '{"ok":false,"reason":"existing-verified-media"}' > "out/$REPAIR_SLOT/meta.json"
            echo "ACCEPTANCE_EXISTING_VERIFIED_MEDIA"
            exit 0
          fi
          set +e
          timeout --signal=TERM --kill-after=30s 8m node scripts/spine-export-webm.mjs \
            --upload-id="$ENTRY_ID" --animation="$ENTRY_ANIMATION" \
            --allow-visible-track-fallback \
            --repo-path="$GITHUB_WORKSPACE" \
            --output="$RUNNER_TEMP/slot-$REPAIR_SLOT-preview.webm" > "$RUNNER_TEMP/renderer.log" 2>&1
          code=$?
          set -e
          if (( code != 0 )) && [[ -s "$RUNNER_TEMP/slot-$REPAIR_SLOT-preview.webm" ]]; then
            # A genuine recorded WebM may survive even when its secondary
            # quality ladder/poster encoder fails. Verify real changing frames
            # and rebuild the missing output files instead of dropping it.
            if node scripts/recover-recorded-webm.mjs \
              "$RUNNER_TEMP/slot-$REPAIR_SLOT-preview.webm" "$ENTRY_ANIMATION" "$ENTRY_ID" \
              "$RUNNER_TEMP/renderer.log" > "$RUNNER_TEMP/recovery.log" 2>&1; then
              echo "REAL_RECORDED_SPINE_WEBM_SALVAGED"
              code=0
            else
              echo "RECORDED_WEBM_RECOVERY_REJECTED"
              if [[ -s "$RUNNER_TEMP/recovery.log" ]]; then
                echo "RECOVERY_DIAGNOSTICS_BEGIN"
                tail -n 60 "$RUNNER_TEMP/recovery.log"
                echo "RECOVERY_DIAGNOSTICS_END"
              fi
            fi
          fi
          if (( code != 0 )); then
            diagnostic=$(node scripts/renderer-failure-class.mjs "$RUNNER_TEMP/renderer.log")
            printf '%s\n' "$diagnostic"
            diagnostic_json="${diagnostic#SANITIZED_RENDER_RESULT=}"
            node --input-type=module -e '
              import fs from "node:fs";
              const result=JSON.parse(process.argv[1]);
              const staticTrack=result.distinctError==="COMPOSITED_FRAMES_IDENTICAL";
              const invisible=result.distinctError==="COMPOSITED_FRAMES_NOT_VISIBLE" ||
                result.distinctError==="RUNTIME_ALL_SKINS_INVISIBLE";
              const invalidAnimation=result.distinctError==="ANIMATION_SELECTION";
              const incompleteSource=["SOURCE_GRAPH_MISSING","ATLAS_TEXTURE_LOAD","ATLAS_REGION_MISSING"].includes(result.distinctError);
              const unsupportedRuntime=["SKELETON_RUNTIME_VERSION","UNSUPPORTED_SPINE_EXPORT_VERSION","UNSUPPORTED_SPINE_3_7_BINARY_SKELETON"].includes(result.distinctError);
              const reason=staticTrack?"blocked-static-animation":
                invisible?"blocked-invisible-default-skin":
                invalidAnimation?"blocked-invalid-default-animation":
                incompleteSource?"blocked-incomplete-source":
                unsupportedRuntime?"blocked-unsupported-runtime":"render-failed";
              fs.writeFileSync(process.argv[2],JSON.stringify({ok:false,reason,distinctError:result.distinctError||"UNCLASSIFIED"}));
            ' "$diagnostic_json" "out/$REPAIR_SLOT/meta.json"
            if [[ -s "$RUNNER_TEMP/renderer.log" ]]; then
              echo "RENDERER_DIAGNOSTICS_BEGIN"
              grep -Ei 'error|failed|ffmpeg|timeout|unsupported|atlas|texture|local_spine_runtime|headless_webgl' "$RUNNER_TEMP/renderer.log" | tail -n 80 || true
              echo "RENDERER_DIAGNOSTICS_END"
            fi
            echo "::warning::Render is blocked when the selected source animation has no visible changing frames; no alternate animation or skin is guessed"
            exit 0
          fi
          for suffix in '' '-medium' '-low'; do
            for ext in webm webp; do
              in="$RUNNER_TEMP/slot-$REPAIR_SLOT-preview$suffix.$ext"
              test -s "$in" || { echo "::error::Missing output $ext"; exit 1; }
              cp "$in" "out/$REPAIR_SLOT/preview$suffix.$ext"
            done
            ffprobe -v error -select_streams v:0 -show_entries stream=codec_name,width,height \
              -of default=nw=1 "out/$REPAIR_SLOT/preview$suffix.webm" | grep -q '^codec_name='
            video_duration=$(ffprobe -v error -show_entries format=duration \
              -of default=nw=1:nk=1 "out/$REPAIR_SLOT/preview$suffix.webm")
            awk -v seconds="$video_duration" 'BEGIN { exit !(seconds >= 0.5) }' || {
              echo "::error::Rejected nonplayable short preview video"
              exit 1
            }
            file "out/$REPAIR_SLOT/preview$suffix.webp" | grep -q 'Web/P image'
            node scripts/verify-poster-first-frame.mjs "out/$REPAIR_SLOT/preview$suffix.webm" "out/$REPAIR_SLOT/preview$suffix.webp"
          done
          node scripts/verify-preview-motion.mjs "out/$REPAIR_SLOT/preview.webm"
          cp "$RUNNER_TEMP/slot-$REPAIR_SLOT-preview.webm.json" "out/$REPAIR_SLOT/meta.json"
          node --input-type=module -e '
            import fs from "node:fs";
            const p=process.argv[1],m=JSON.parse(fs.readFileSync(p,"utf8"));
            const expectedAnimation=process.env.ENTRY_ANIMATION;
            const allowFallback=process.env.ALLOW_VISIBLE_TRACK_FALLBACK==="true";
            const animationMatches=typeof m.animation==="string"&&m.animation.length>0&&
              (allowFallback||expectedAnimation==="__SPINE_AUTO__"||m.animation===expectedAnimation);
            if(!m.sha256||!m.bytes||!animationMatches||!m.width||!m.height)
              throw new Error("Export metadata incomplete or no source animation was selected");
            const safe={ok:true,animationMatches:true,animation:m.animation,
              animationFallbackUsed:Boolean(m.animationFallbackUsed),width:m.width,height:m.height,
              animationDuration:m.animationDuration,qualityWidths:m.qualityWidths};
            fs.writeFileSync(p,JSON.stringify(safe));
            console.log("ACCEPTANCE_PASS_WEBM_WEBP_3_QUALITIES");
          ' "out/$REPAIR_SLOT/meta.json"
      - uses: actions/upload-artifact@v4
        if: always() && matrix.entry.needsRender
        with:
          name: latest50-${{ matrix.entry.repairSlot }}
          path: out/${{ matrix.entry.repairSlot }}/
          if-no-files-found: error
          retention-days: 1
  publish:
    needs: [inventory, render]
    outputs:
      published_sha: ${{ steps.publish.outputs.published_sha }}
    env:
      SPINE_REPAIR_LIMIT: ${{ github.event_name == 'pull_request' && '20' || inputs.limit || '50' }}
      SPINE_REPAIR_OFFSET: ${{ github.event_name == 'pull_request' && '0' || inputs.offset || '0' }}
      REPAIR_IDS_FILE: repair-manifest/repair-manifest.json
    permissions:
      contents: write
    if: always() && github.ref == 'refs/heads/main' && needs.inventory.result == 'success'
    runs-on: ubuntu-24.04
    timeout-minutes: 12
    concurrency:
      group: spine-library-commit
      cancel-in-progress: false
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          sparse-checkout-cone-mode: false
          sparse-checkout: |
            /scripts/
            /library/index.json
            /library_*/index.json
      - uses: actions/download-artifact@v4
        with:
          name: latest50-manifest
          path: repair-manifest
      - name: Mask and hydrate source-ready latest-50 source directories
        env:
          REPAIR_IDS_FILE: repair-manifest/repair-manifest.json
        shell: bash
        run: |
          set -euo pipefail
          node scripts/mask-preview-manifest.mjs
          node --input-type=module <<'NODE'
          import { execFileSync } from 'node:child_process';
          const selected=JSON.parse(await (await import('node:fs/promises')).readFile(process.env.REPAIR_IDS_FILE,'utf8'));
          if(selected.length!==Number(process.env.SPINE_REPAIR_LIMIT||50))throw new Error('Missing exact repair manifest');
          const paths=new Set();
          for(const item of selected){
            const hasExistingAcceptedMedia=item.indexedWebmStatus==='ready' ||
              item.indexedPreviewStatus==='ready' ||
              (Array.isArray(item.indexedPreviewSetNames) && item.indexedPreviewSetNames.length>0);
            if(item.ready!==true && !hasExistingAcceptedMedia)continue;
            const source=String(item.previewPath||'');
            if(!source||source.startsWith('/')||source.split('/').includes('..')||
              !source.startsWith(String(item.basePath||'')+'/'))throw new Error('Invalid source directory in repair manifest');
            paths.add(source);
          }
          if(paths.size)execFileSync('git',['sparse-checkout','add',...Array.from(paths,source=>source+'/')],{stdio:'ignore'});
          console.log('SOURCE_PATHS_HYDRATED');
          NODE
      - uses: actions/download-artifact@v4
        if: needs.inventory.outputs.renderCount != '0'
        with:
          pattern: latest50-*
          path: downloaded-latest50
          merge-multiple: false
      - uses: actions/setup-node@v7
        with:
          node-version: '22'
      - name: Install pinned FFmpeg binaries for exact first-frame poster refresh
        shell: bash
        run: |
          set -euo pipefail
          npm install --no-save --no-audit --no-fund --prefix "$RUNNER_TEMP/ffmpeg-native" \
            @ffprobe-installer/ffprobe @ffmpeg-installer/ffmpeg
          mkdir -p "$RUNNER_TEMP/ffmpeg-bin"
          FFPROBE_BINARY=$(node -p "require('$RUNNER_TEMP/ffmpeg-native/node_modules/@ffprobe-installer/ffprobe').path")
          FFMPEG_BINARY=$(node -p "require('$RUNNER_TEMP/ffmpeg-native/node_modules/@ffmpeg-installer/ffmpeg').path")
          test -x "$FFPROBE_BINARY" && test -x "$FFMPEG_BINARY"
          ln -sf "$FFPROBE_BINARY" "$RUNNER_TEMP/ffmpeg-bin/ffprobe"
          ln -sf "$FFMPEG_BINARY" "$RUNNER_TEMP/ffmpeg-bin/ffmpeg"
          echo "$RUNNER_TEMP/ffmpeg-bin" >> "$GITHUB_PATH"
          export PATH="$RUNNER_TEMP/ffmpeg-bin:$PATH"
          ffmpeg -version | head -n 1
          ffprobe -version | head -n 1
      - name: Verify real high/medium/low WebP posters against their own WebM frame zero
        run: node scripts/test-first-frame-poster-real.mjs
      - name: Publish verified only, retain source untouched, flag missing and failed
        id: publish
        shell: bash
        run: |
          set -euo pipefail
          git config user.name github-actions[bot]
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          for attempt in 1 2 3 4; do
            git fetch --no-tags origin +refs/heads/main:refs/remotes/origin/main
            git reset --hard refs/remotes/origin/main
            node scripts/repair-latest-twenty-previews.mjs merge
            # Stage ONLY outputs inside library collections; CI artifacts and
            # temporary source files must never enter the repository.
            # The sparse checkout contains the selected library_NN entries.
            # Stage only checked-out shard folders. Including unsparsed
            # "library" aborts this step and discards verified preview media.
            git add -A -- library_*
            if git diff --cached --quiet; then
              echo "NO_PREVIEW_CHANGES"
              echo "published_sha=$(git rev-parse HEAD)" >> "$GITHUB_OUTPUT"
              node -e 'const s=require("./preview-repair-summary.json");console.log("LATEST50_PUBLISH_SUMMARY="+JSON.stringify(s));if(s.failed>0)console.warn("Unresolved previews fail the separate production gate")'
              exit 0
            fi
            git commit -m "fix: restore validated previews for archive batch offset ${SPINE_REPAIR_OFFSET} limit ${SPINE_REPAIR_LIMIT}"
            if git push origin HEAD:main; then
              echo "LATEST50_REPAIR_PUBLISHED"
              echo "published_sha=$(git rev-parse HEAD)" >> "$GITHUB_OUTPUT"
              node -e 'const s=require("./preview-repair-summary.json");console.log("LATEST50_PUBLISH_SUMMARY="+JSON.stringify(s));if(s.failed>0)console.warn("Unresolved previews fail the separate production gate")'
              exit 0
            fi
            sleep $(( attempt * 3 ))
          done
          echo "::error::Could not atomically publish latest-20 previews"
          exit 1

  verify-production:
    needs: [inventory, render, publish]
    env:
      SPINE_REPAIR_LIMIT: ${{ github.event_name == 'pull_request' && '20' || inputs.limit || '50' }}
      SPINE_REPAIR_OFFSET: ${{ github.event_name == 'pull_request' && '0' || inputs.offset || '0' }}
      REPAIR_IDS_FILE: repair-manifest/repair-manifest.json
      PUBLISHED_SHA: ${{ needs.publish.outputs.published_sha }}
    if: always() && github.ref == 'refs/heads/main' && needs.publish.result == 'success'
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          sparse-checkout-cone-mode: false
          sparse-checkout: |
            /scripts/verify-latest-twenty-live.mjs
            /scripts/repair-manifest-guard.mjs
            /scripts/lib/fetch-public-index.mjs
            /scripts/mask-preview-manifest.mjs
            /scripts/lib/preview-manifest-redaction.mjs
            /scripts/lib/export-log-redaction.mjs
      - uses: actions/download-artifact@v4
        with:
          name: latest50-manifest
          path: repair-manifest
      - name: Mask exact production audit manifest
        env:
          REPAIR_IDS_FILE: repair-manifest/repair-manifest.json
        run: node scripts/mask-preview-manifest.mjs
      - uses: actions/setup-node@v7
        with:
          node-version: '22'
      - name: Verify every selected public media response after publication
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: node scripts/verify-latest-twenty-live.mjs
  dispatch-next-batch:
    needs: [inventory, render, publish, verify-production]
    if: always() && github.event_name != 'schedule' && github.ref == 'refs/heads/main' && needs.publish.result == 'success' && needs.verify-production.result == 'success' && fromJSON(needs.inventory.outputs.nextOffset) < 70 && fromJSON(needs.inventory.outputs.nextOffset) < fromJSON(needs.inventory.outputs.totalCount)
    runs-on: ubuntu-24.04
    permissions:
      actions: write
      contents: read
    steps:
      - name: Queue the next older archive batch after verified-only publication
        env:
          GH_TOKEN: ${{ github.token }}
          NEXT_OFFSET: ${{ needs.inventory.outputs.nextOffset }}
          TOTAL_COUNT: ${{ needs.inventory.outputs.totalCount }}
        shell: bash
        run: |
          set -euo pipefail
          remaining=$(( 70 - NEXT_OFFSET ))
          available=$(( TOTAL_COUNT - NEXT_OFFSET ))
          if (( remaining > available )); then remaining=$available; fi
          next_limit=$(( remaining < 50 ? remaining : 50 ))
          gh api --method POST \
            "repos/${GITHUB_REPOSITORY}/actions/workflows/repair-latest-twenty-previews.yml/dispatches" \
            -f ref=main \
            -f inputs[offset]="$NEXT_OFFSET" \
            -f inputs[limit]="$next_limit"
          echo "DISPATCHED_NEXT_ARCHIVE_BATCH offset=$NEXT_OFFSET limit=$next_limit total=$TOTAL_COUNT"
