name: Recover newest 20 Spine WebP and WebM previews
on:
  push:
    branches: [main]
    paths:
      - .github/workflows/repair-latest-twenty-previews.yml
      - scripts/repair-latest-twenty-previews.mjs
      - scripts/verify-latest-twenty-live.mjs
      - scripts/test-repair-latest-twenty.mjs
      - scripts/verify-preview-motion.mjs
      - scripts/spine-export-webm.mjs
      - scripts/render-work.mjs
      - scripts/preview-animation-choice.mjs
      - scripts/test-preview-animation-choice.mjs
      - scripts/renderer-failure-class.mjs
      - scripts/lib/render-failure-receipt.mjs
      - scripts/test-render-failure-receipt.mjs
      - scripts/test-repair-manifest-privacy.mjs
      - scripts/lib/spine-binary-json-alias.mjs
      - scripts/test-spine-binary-json-alias.mjs
      - scripts/lib/atlas-source-integrity.mjs
      - scripts/install-pinned-spine-players.sh
      - scripts/lib/preview-visibility-recovery.mjs
      - scripts/atlas-pages.mjs
      - scripts/test-atlas-pages.mjs
      - .github/workflows/spine-export-webm.yml
      - scripts/test-preview-visibility-recovery.mjs
      - scripts/lib/atlas-source-integrity.mjs
      - scripts/test-atlas-source-integrity.mjs
  pull_request:
    paths:
      - .github/workflows/repair-latest-twenty-previews.yml
      - scripts/repair-latest-twenty-previews.mjs
      - scripts/verify-latest-twenty-live.mjs
      - scripts/test-repair-latest-twenty.mjs
      - scripts/verify-preview-motion.mjs
      - scripts/spine-export-webm.mjs
      - scripts/render-work.mjs
      - scripts/preview-animation-choice.mjs
      - scripts/test-preview-animation-choice.mjs
      - scripts/renderer-failure-class.mjs
      - scripts/lib/render-failure-receipt.mjs
      - scripts/test-render-failure-receipt.mjs
      - scripts/test-repair-manifest-privacy.mjs
      - scripts/lib/spine-binary-json-alias.mjs
      - scripts/test-spine-binary-json-alias.mjs
      - scripts/lib/atlas-source-integrity.mjs
      - scripts/install-pinned-spine-players.sh
      - scripts/lib/preview-visibility-recovery.mjs
      - scripts/atlas-pages.mjs
      - scripts/test-atlas-pages.mjs
      - .github/workflows/spine-export-webm.yml
      - scripts/test-preview-visibility-recovery.mjs
      - scripts/lib/atlas-source-integrity.mjs
      - scripts/test-atlas-source-integrity.mjs
  workflow_dispatch:
permissions:
  contents: write
concurrency:
  group: spine-preview-latest-twenty-${{ github.ref }}
  cancel-in-progress: false
jobs:
  inventory:
    runs-on: ubuntu-24.04
    outputs:
      matrix: ${{ steps.latest.outputs.matrix }}
      allEntries: ${{ steps.latest.outputs.allEntries }}
      renderCount: ${{ steps.latest.outputs.renderCount }}
      sparseCheckout: ${{ steps.latest.outputs.sparseCheckout }}
    steps:
      - uses: actions/checkout@v4
        with:
          sparse-checkout-cone-mode: false
          sparse-checkout: |
            /scripts/
            /library/index.json
            /library_*/index.json
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Enumerate 20 newest uploads and validate required source file triads
        id: latest
        env:
          SPINE_REPAIR_INDEX_ONLY: '1'
          SPINE_REPAIR_SKIP_LIVE: ${{ github.event_name == 'pull_request' && '1' || '0' }}
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        shell: bash
        run: |
          node scripts/repair-latest-twenty-previews.mjs matrix >> "$GITHUB_OUTPUT"
          node --check scripts/repair-latest-twenty-previews.mjs
          node --check scripts/verify-latest-twenty-live.mjs
          node --check scripts/verify-preview-motion.mjs
          node scripts/test-repair-latest-twenty.mjs
          node scripts/test-preview-visibility-recovery.mjs
          node --check scripts/spine-export-webm.mjs
          node --check scripts/recover-recorded-webm.mjs
          node scripts/test-canvas-fallback.mjs
          node scripts/test-atlas-pages.mjs
          node scripts/test-atlas-source-integrity.mjs
          node scripts/test-spine-version-detect.mjs
          node scripts/test-spine-binary-json-alias.mjs
          node scripts/test-preview-animation-choice.mjs
          node --check scripts/render-work.mjs
          node --check scripts/lib/render-failure-receipt.mjs
          node scripts/test-render-failure-receipt.mjs
          node scripts/test-repair-manifest-privacy.mjs
          node scripts/test-repair-manifest-guard.mjs
          echo "LATEST20_INVENTORY_VALID"
      - uses: actions/upload-artifact@v4
        with:
          name: repair-manifest
          path: repair-manifest.json
          retention-days: 1
  runtime-package-smoke:
    runs-on: ubuntu-24.04
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v4
        with:
          sparse-checkout-cone-mode: false
          sparse-checkout: |
            /scripts/install-pinned-spine-players.sh
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Verify all three pinned Spine runtime bundles load from disk
        run: bash scripts/install-pinned-spine-players.sh "$RUNNER_TEMP/spine-player-runtimes"
  render:
    name: render-${{ strategy.job-index }}
    needs: [inventory, runtime-package-smoke]
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-24.04
    timeout-minutes: 35
    strategy:
      fail-fast: false
      max-parallel: 4
      matrix:
        entry: ${{ fromJson(needs.inventory.outputs.matrix) }}
    steps:
      - uses: actions/checkout@v4
        with:
          sparse-checkout-cone-mode: false
          sparse-checkout: |
            /scripts/
            /package.json
            /package-lock.json
            /public/vendor-spine-player-*.js
            /public/vendor-spine-player-*.css
            /library/index.json
            /library_*/index.json
      - uses: actions/download-artifact@v4
        with:
          name: repair-manifest
          path: repair-manifest
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Install native Chromium renderer and video/poster encoders
        if: matrix.entry.needsRender
        shell: bash
        run: |
          set -euo pipefail
          npm install --no-save --no-audit --no-fund playwright@1.59.1
          bash scripts/install-pinned-spine-players.sh "$RUNNER_TEMP/spine-player-runtimes"
          if command -v google-chrome >/dev/null 2>&1; then
            echo "PLAYWRIGHT_EXECUTABLE=$(command -v google-chrome)" >> "$GITHUB_ENV"
            echo "Using preinstalled Chrome for WebGL preview rendering"
          else
            npx playwright install chromium
          fi
          if ! command -v ffmpeg >/dev/null 2>&1 || ! command -v ffprobe >/dev/null 2>&1; then
            sudo apt-get update -qq
            sudo apt-get install -y -qq ffmpeg
          fi
      - name: Render and validate actual Spine video + still posters
        if: matrix.entry.needsRender
        shell: bash
        env:
          ENTRY_INDEX: ${{ matrix.entry.index }}
        run: |
          set -euo pipefail
          ENTRY_DATA=$(node --input-type=module -e '
            import fs from "node:fs";
            const rows=JSON.parse(fs.readFileSync("repair-manifest/repair-manifest.json","utf8"));
            const item=rows[Number(process.env.ENTRY_INDEX)];
            if(!item)throw new Error("Repair manifest index missing");
            process.stdout.write([item.id,String(item.ready),String(item.needsRender),item.animation||"",item.previewPath].join("\n"));
          ')
          mapfile -t ENTRY_VALUES <<< "$ENTRY_DATA"
          ENTRY_ID="${ENTRY_VALUES[0]}"
          ENTRY_READY="${ENTRY_VALUES[1]}"
          ENTRY_NEEDS_RENDER="${ENTRY_VALUES[2]}"
          ENTRY_ANIMATION="${ENTRY_VALUES[3]}"
          ENTRY_PATH="${ENTRY_VALUES[4]}"
          git sparse-checkout add "$ENTRY_PATH"
          mkdir -p "out/$ENTRY_INDEX"
          if [[ "$ENTRY_READY" != true ]]; then
            echo '{"ok":false,"reason":"incomplete-source"}' > "out/$ENTRY_INDEX/meta.json"
            echo "ACCEPTANCE_BLOCKED_INCOMPLETE_SOURCE"
            exit 0
          fi
          if [[ "$ENTRY_NEEDS_RENDER" != true ]]; then
            echo '{"ok":false,"reason":"existing-verified-media"}' > "out/$ENTRY_INDEX/meta.json"
            echo "ACCEPTANCE_EXISTING_VERIFIED_MEDIA"
            exit 0
          fi
          set +e
          node scripts/spine-export-webm.mjs \
            --upload-id="$ENTRY_ID" --animation="$ENTRY_ANIMATION" \
            --repo-path="$GITHUB_WORKSPACE" \
            --output="$RUNNER_TEMP/preview-$ENTRY_INDEX.webm" > "$RUNNER_TEMP/renderer.log" 2>&1
          code=$?
          set -e
          if (( code != 0 )) && [[ -s "$RUNNER_TEMP/preview-$ENTRY_INDEX.webm" ]]; then
            # A genuine recorded WebM may survive even when its secondary
            # quality ladder/poster encoder fails. Verify real changing frames
            # and rebuild the missing output files instead of dropping it.
            if node scripts/recover-recorded-webm.mjs \
              "$RUNNER_TEMP/preview-$ENTRY_INDEX.webm" "$ENTRY_ANIMATION" "$ENTRY_ID" \
              > "$RUNNER_TEMP/recovery.log" 2>&1; then
              echo "REAL_RECORDED_SPINE_WEBM_SALVAGED"
              code=0
            else
              echo "RECORDED_WEBM_RECOVERY_REJECTED"
            fi
          fi
          if (( code != 0 )); then
            classification=$(node scripts/renderer-failure-class.mjs "$RUNNER_TEMP/renderer.log")
            reason=$(RENDER_CLASSIFICATION="$classification" node --input-type=module -e '
              const value=process.env.RENDER_CLASSIFICATION||"";
              const start=value.indexOf("{");
              const parsed=JSON.parse(value.slice(start));
              process.stdout.write(String(parsed.reason||"OTHER_RENDER_FAILURE"));
            ')
            status=failed
            case "$reason" in
              ANIMATION_SELECTION_MISSING|ANIMATION_SELECTION|LEGACY_RUNTIME_MISSING|SOURCE_GRAPH_MISSING) status=blocked ;;
            esac
            printf '{"ok":false,"status":"%s","reason":"%s"}\\n' "$status" "$reason" > "out/$ENTRY_INDEX/meta.json"
            echo "::warning::Preview acceptance is blocked or failed; no alternate animation was selected"
            exit 0
          fi
          for suffix in '' '-medium' '-low'; do
            for ext in webm webp; do
              in="$RUNNER_TEMP/preview-$ENTRY_INDEX$suffix.$ext"
              test -s "$in" || { echo "::error::Missing output $ext"; exit 1; }
              cp "$in" "out/$ENTRY_INDEX/preview$suffix.$ext"
            done
            ffprobe -v error -select_streams v:0 -show_entries stream=codec_name,width,height \
              -of default=nw=1 "out/$ENTRY_INDEX/preview$suffix.webm" | grep -q '^codec_name='
            video_duration=$(ffprobe -v error -show_entries format=duration \
              -of default=nw=1:nk=1 "out/$ENTRY_INDEX/preview$suffix.webm")
            awk -v seconds="$video_duration" 'BEGIN { exit !(seconds >= 0.5) }' || {
              echo "::error::Rejected nonplayable short preview video"
              exit 1
            }
            file "out/$ENTRY_INDEX/preview$suffix.webp" | grep -q 'Web/P image'
          done
          node scripts/verify-preview-motion.mjs "out/$ENTRY_INDEX/preview.webm"
          cp "$RUNNER_TEMP/preview-$ENTRY_INDEX.webm.json" "out/$ENTRY_INDEX/meta.json"
          node --input-type=module -e '
            import fs from "node:fs";
            const p=process.argv[1],m=JSON.parse(fs.readFileSync(p,"utf8"));
            if(!m.sha256||!m.bytes||!m.animation||!m.width||!m.height)
              throw new Error("Export metadata incomplete");
            m.ok=true;
            fs.writeFileSync(p,JSON.stringify(m));
            console.log("ACCEPTANCE_PASS_WEBM_WEBP_3_QUALITIES");
          ' "out/$ENTRY_INDEX/meta.json"
      - uses: actions/upload-artifact@v4
        if: always() && matrix.entry.needsRender
        with:
          name: latest20-${{ matrix.entry.index }}
          path: out/${{ matrix.entry.index }}/
          if-no-files-found: error
          retention-days: 1
  publish:
    needs: [inventory, render]
    if: always() && github.ref == 'refs/heads/main' && needs.inventory.result == 'success'
    runs-on: ubuntu-24.04
    timeout-minutes: 12
    concurrency:
      group: spine-library-commit
      cancel-in-progress: false
    steps:
      - uses: actions/checkout@v4
        with:
          sparse-checkout-cone-mode: false
          sparse-checkout: ${{ needs.inventory.outputs.sparseCheckout }}
      - uses: actions/download-artifact@v4
        if: needs.inventory.outputs.renderCount != '0'
        with:
          pattern: latest20-*
          path: downloaded-latest20
          merge-multiple: false
      - uses: actions/download-artifact@v4
        with:
          name: repair-manifest
          path: repair-manifest
      - name: Add frozen source folders without printing their names
        run: |
          node --input-type=module -e '
            import fs from "node:fs";
            import {execFileSync} from "node:child_process";
            const items=JSON.parse(fs.readFileSync("repair-manifest/repair-manifest.json","utf8"));
            for(const item of items) execFileSync("git",["sparse-checkout","add",item.previewPath],{stdio:"ignore"});
          '
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Publish verified only, retain source untouched, flag missing and failed
        shell: bash
        env:
          REPAIR_MANIFEST_PATH: repair-manifest/repair-manifest.json
        run: |
          set -euo pipefail
          git config user.name github-actions[bot]
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          for attempt in 1 2 3 4; do
            git fetch --no-tags origin +refs/heads/main:refs/remotes/origin/main
            git reset --hard refs/remotes/origin/main
            node scripts/repair-latest-twenty-previews.mjs merge
            # Stage ONLY outputs inside library collections; CI artifacts and
            # temporary source files must never enter the repository.
            # The sparse checkout contains the selected library_NN entries.
            # Stage only checked-out shard folders. Including unsparsed
            # "library" aborts this step and discards verified preview media.
            git add -A -- library_*
            if git diff --cached --quiet; then
              echo "NO_PREVIEW_CHANGES"
              node -e 'const s=require("./preview-repair-summary.json");console.log("LATEST20_PUBLISH_SUMMARY="+JSON.stringify(s));if(s.failed>0)console.warn("Unresolved previews fail the separate production gate")'
              exit 0
            fi
            git commit -m 'fix: restore validated previews for latest 20 Spine uploads'
            if git push origin HEAD:main; then
              echo "LATEST20_REPAIR_PUBLISHED"
              node -e 'const s=require("./preview-repair-summary.json");console.log("LATEST20_PUBLISH_SUMMARY="+JSON.stringify(s));if(s.failed>0)console.warn("Unresolved previews fail the separate production gate")'
              exit 0
            fi
            sleep $(( attempt * 3 ))
          done
          echo "::error::Could not atomically publish latest-20 previews"
          exit 1

  verify-production:
    needs: [inventory, render, publish]
    if: github.ref == 'refs/heads/main' && needs.publish.result == 'success'
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          sparse-checkout-cone-mode: false
          sparse-checkout: |
            /scripts/verify-latest-twenty-live.mjs
            /scripts/repair-manifest-guard.mjs
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - uses: actions/download-artifact@v4
        with:
          name: repair-manifest
          path: repair-manifest
      - name: Verify 20 actual public media responses after publication
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          REPAIR_MANIFEST_PATH: repair-manifest/repair-manifest.json
        run: node scripts/verify-latest-twenty-live.mjs
